<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Objects Also Show People at Work</title><desc id="desc">A material source: A religious object can support questions about making, use and patronage.. Makers mattered: Artisans and existing local skills should remain visible in accounts of religious art.. A limit: A commission or image alone does not establish every maker's motive or every viewer's belief.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Objects Also Show People at Work</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare practices, objects and dated evidence without assuming private belief.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A material source</text><text x="54" y="249" font-size="16" fill="#243b3b">A religious object can</text><text x="54" y="273" font-size="16" fill="#243b3b">support questions about</text><text x="54" y="297" font-size="16" fill="#243b3b">making, use and patronage.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Makers mattered</text><text x="369" y="249" font-size="16" fill="#243b3b">Artisans and existing local</text><text x="369" y="273" font-size="16" fill="#243b3b">skills should remain visible</text><text x="369" y="297" font-size="16" fill="#243b3b">in accounts of religious art.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">A limit</text><text x="684" y="249" font-size="16" fill="#243b3b">A commission or image alone</text><text x="684" y="273" font-size="16" fill="#243b3b">does not establish every</text><text x="684" y="297" font-size="16" fill="#243b3b">maker's motive or every</text><text x="684" y="321" font-size="16" fill="#243b3b">viewer's belief.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original artifact, ceremony image or reconstructed building.</text></g></svg>