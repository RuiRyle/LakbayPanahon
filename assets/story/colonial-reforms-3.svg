<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Income and Burdens Could Coexist</title><desc id="desc">Modern teaching cards: Goal: Revenue was a government aim.. Requirement: A quota required an amount of production.. Comparison: Government income alone does not measure household wellbeing.</desc><rect width="760" height="610" rx="26" fill="#163e38"/><text x="42" y="54" fill="#ebcc83" font-family="sans-serif" font-size="16">HISTORY EVIDENCE JOURNAL</text><text x="42" y="103" fill="#fff5da" font-family="sans-serif" font-size="25">Income and Burdens Could Coexist</text><rect x="42" y="145" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="175" fill="#61431e" font-family="sans-serif" font-size="20">Goal</text><text x="65" y="202" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Revenue was a government aim.</tspan></text><rect x="42" y="275" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="305" fill="#61431e" font-family="sans-serif" font-size="20">Requirement</text><text x="65" y="332" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">A quota required an amount of production.</tspan></text><rect x="42" y="405" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="435" fill="#61431e" font-family="sans-serif" font-size="20">Comparison</text><text x="65" y="462" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Government income alone does not measure household</tspan><tspan x="65" dy="22">wellbeing.</tspan></text><text x="42" y="581" fill="#fff5da" font-family="sans-serif" font-size="14">Modern learning diagram - not an original historical source</text></svg>