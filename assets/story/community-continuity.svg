<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Change Did Not Mean One Identical Path</title><desc id="desc">Continuity and change: A new institution does not automatically mean every older practice disappeared.. Local interpretation: Local intermediaries helped interpret and transmit teachings in particular settings.. Avoid a universal formula: A distinct combination of actions in one example does not establish identical beliefs across all communities.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Change Did Not Mean One Identical Path</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare practices, objects and dated evidence without assuming private belief.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Continuity and change</text><text x="54" y="249" font-size="16" fill="#243b3b">A new institution does not</text><text x="54" y="273" font-size="16" fill="#243b3b">automatically mean every</text><text x="54" y="297" font-size="16" fill="#243b3b">older practice disappeared.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Local interpretation</text><text x="369" y="249" font-size="16" fill="#243b3b">Local intermediaries helped</text><text x="369" y="273" font-size="16" fill="#243b3b">interpret and transmit</text><text x="369" y="297" font-size="16" fill="#243b3b">teachings in particular</text><text x="369" y="321" font-size="16" fill="#243b3b">settings.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Avoid a universal formula</text><text x="684" y="249" font-size="16" fill="#243b3b">A distinct combination of</text><text x="684" y="273" font-size="16" fill="#243b3b">actions in one example does</text><text x="684" y="297" font-size="16" fill="#243b3b">not establish identical</text><text x="684" y="321" font-size="16" fill="#243b3b">beliefs across all</text><text x="684" y="345" font-size="16" fill="#243b3b">communities.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original artifact, ceremony image or reconstructed building.</text></g></svg>