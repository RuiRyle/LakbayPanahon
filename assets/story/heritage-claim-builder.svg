<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>A claim needs evidence links and a limit</title><desc>State a claim; explain how source A supports it; explain how source B supports it; state what the sources do not establish.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">A claim needs evidence links and a limit</text><rect x="35" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="50" y="210" font-size="25">CLAIM</text><text x="50" y="290" font-size="21">What are you</text><text x="50" y="340" font-size="21">explaining?</text><rect x="355" y="140" width="290" height="300" rx="18" fill="#dbecef"/><text x="370" y="210" font-size="25">TWO SOURCE LINKS</text><text x="370" y="290" font-size="21">What does each</text><text x="370" y="340" font-size="21">source support?</text><rect x="675" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="690" y="210" font-size="25">LIMIT</text><text x="690" y="290" font-size="21">What is not</text><text x="690" y="340" font-size="21">established?</text><text x="45" y="545" font-size="22">Keep each source and context distinct. State what remains uncertain.</text></g></svg>