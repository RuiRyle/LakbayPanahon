<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Communities Were More Than Labels</title><desc id="d">Diversity: Sama, Tausug and other communities cannot be reduced to one identical experience.. Perspective: A source has a maker, purpose and date.. Scope: A ruler, institution or category does not automatically speak for every person.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Communities Were More Than Labels</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Diversity</text><text x="22" y="59" font-size="16" fill="#383d38">Sama, Tausug and other communities cannot be reduced to one</text><text x="22" y="80" font-size="16" fill="#383d38">identical experience.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Perspective</text><text x="22" y="59" font-size="16" fill="#383d38">A source has a maker, purpose and date.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Scope</text><text x="22" y="59" font-size="16" fill="#383d38">A ruler, institution or category does not automatically speak</text><text x="22" y="80" font-size="16" fill="#383d38">for every person.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the polity, people, period and supporting evidence.</text></g></svg>