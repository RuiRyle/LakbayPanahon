<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Worked sequence: making needs learned knowledge</title><desc>Three process stages: select and prepare material; use a learned technique; check the result against its purpose. The diagram does not reproduce a community pattern or give a complete making tutorial.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Worked sequence: making needs learned knowledge</text><rect x="35" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="50" y="210" font-size="25">1. PREPARE</text><text x="50" y="285" font-size="21">Select suitable material</text><text x="50" y="335" font-size="21">Prepare it for use</text><rect x="355" y="140" width="290" height="300" rx="18" fill="#dbecef"/><text x="370" y="210" font-size="25">2. MAKE</text><text x="370" y="285" font-size="21">Use a learned method</text><text x="370" y="335" font-size="21">Apply knowledge</text><rect x="675" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="690" y="210" font-size="25">3. CHECK</text><text x="690" y="285" font-size="21">Does the result</text><text x="690" y="335" font-size="21">meet the purpose?</text><text x="50" y="540" font-size="23">Teaching model: no restricted pattern or universal craft recipe.</text></g></svg>