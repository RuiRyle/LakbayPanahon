<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>How traditions are passed on</title><desc>Hudhud narrative chants are learned through performance. Documented safeguarding efforts include recording and schools for living traditions. Teaching can continue while additional supports change. This does not prove every past performance was identical.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">How traditions are passed on</text><rect x="35" y="110" width="445" height="375" rx="18" fill="#e4e8dc"/><rect x="520" y="110" width="445" height="375" rx="18" fill="#dbecef"/><text x="60" y="165" font-size="25">TRADITIONAL LEARNING</text><text x="60" y="235" font-size="22">Story chants</text><text x="60" y="285" font-size="22">Listening and performance</text><text x="60" y="335" font-size="22">Knowledge passed to learners</text><text x="545" y="165" font-size="25">ADDITIONAL SUPPORT</text><text x="545" y="235" font-size="22">Written records and recordings</text><text x="545" y="285" font-size="22">Organized teaching</text><text x="545" y="335" font-size="22">Schools for living traditions</text><text x="60" y="430" font-size="23">Continuity: passing on knowledge</text><text x="60" y="550" font-size="23">Do not assume every performance stayed the same for centuries.</text><text x="35" y="615" font-size="20">Teaching comparison: name the source, explain its meaning and state a limit.</text></g></svg>