<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Practice Is Not Every Private Belief</title><desc id="desc">Different questions: Belief, practice and institution describe related but distinct parts of religious life.. A recorded action: Participation or a building does not by itself reveal every person's private belief.. Respect difference: Earlier traditions and different religious histories must not be erased or ranked by worth.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Practice Is Not Every Private Belief</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare practices, objects and dated evidence without assuming private belief.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Different questions</text><text x="54" y="249" font-size="16" fill="#243b3b">Belief, practice and</text><text x="54" y="273" font-size="16" fill="#243b3b">institution describe related</text><text x="54" y="297" font-size="16" fill="#243b3b">but distinct parts of</text><text x="54" y="321" font-size="16" fill="#243b3b">religious life.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A recorded action</text><text x="369" y="249" font-size="16" fill="#243b3b">Participation or a building</text><text x="369" y="273" font-size="16" fill="#243b3b">does not by itself reveal</text><text x="369" y="297" font-size="16" fill="#243b3b">every person's private</text><text x="369" y="321" font-size="16" fill="#243b3b">belief.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Respect difference</text><text x="684" y="249" font-size="16" fill="#243b3b">Earlier traditions and</text><text x="684" y="273" font-size="16" fill="#243b3b">different religious histories</text><text x="684" y="297" font-size="16" fill="#243b3b">must not be erased or ranked</text><text x="684" y="321" font-size="16" fill="#243b3b">by worth.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original artifact, ceremony image or reconstructed building.</text></g></svg>