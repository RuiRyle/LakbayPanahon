<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Living Tradition Is Not a Time Machine</title><desc id="desc">A named living heritage: The National Museum describes Marinduque Moryonan, including mask-making, as living cultural heritage.. Date the evidence: A modern description or object does not automatically establish every colonial-era detail.. Respect sources: Compare dates and purposes, credit community knowledge and do not invent an unchanged history.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Living Tradition Is Not a Time Machine</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare practices, objects and dated evidence without assuming private belief.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A named living heritage</text><text x="54" y="249" font-size="16" fill="#243b3b">The National Museum describes</text><text x="54" y="273" font-size="16" fill="#243b3b">Marinduque Moryonan,</text><text x="54" y="297" font-size="16" fill="#243b3b">including mask-making, as</text><text x="54" y="321" font-size="16" fill="#243b3b">living cultural heritage.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Date the evidence</text><text x="369" y="249" font-size="16" fill="#243b3b">A modern description or</text><text x="369" y="273" font-size="16" fill="#243b3b">object does not automatically</text><text x="369" y="297" font-size="16" fill="#243b3b">establish every colonial-era</text><text x="369" y="321" font-size="16" fill="#243b3b">detail.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Respect sources</text><text x="684" y="249" font-size="16" fill="#243b3b">Compare dates and purposes,</text><text x="684" y="273" font-size="16" fill="#243b3b">credit community knowledge</text><text x="684" y="297" font-size="16" fill="#243b3b">and do not invent an</text><text x="684" y="321" font-size="16" fill="#243b3b">unchanged history.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original artifact, ceremony image or reconstructed building.</text></g></svg>