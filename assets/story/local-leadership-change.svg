<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Continuity and change</title><desc id="desc">Earlier leadership: Communities had leadership and histories before colonial offices.. Colonial relationships: Some local influence could persist within changed institutions.. Avoid a universal label: Prominent participants did not represent every Indigenous person.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Continuity and change</text><text x="34" y="103" font-size="17" fill="#e0eee8">A teaching comparison, not one unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Earlier leadership</text><text x="54" y="235" font-size="17" fill="#243b3b">Communities had leadership</text><text x="54" y="262" font-size="17" fill="#243b3b">and histories before colonial</text><text x="54" y="289" font-size="17" fill="#243b3b">offices.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Colonial relationships</text><text x="369" y="235" font-size="17" fill="#243b3b">Some local influence could</text><text x="369" y="262" font-size="17" fill="#243b3b">persist within changed</text><text x="369" y="289" font-size="17" fill="#243b3b">institutions.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Avoid a universal label</text><text x="684" y="235" font-size="17" fill="#243b3b">Prominent participants did</text><text x="684" y="262" font-size="17" fill="#243b3b">not represent every</text><text x="684" y="289" font-size="17" fill="#243b3b">Indigenous person.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram, not an original order, election record or historical quotation.</text></g></svg>