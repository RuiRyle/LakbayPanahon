<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A claim is not proof of its reach</title><desc id="desc">Check several factors rather than treating one feature as destiny. The claim: What did an official or institution say it could command?. The evidence: Where and when did actions occur? What resources and connections were needed?. The response: Who complied, negotiated or resisted? What remains unknown?</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">A claim is not proof of its reach</text><text x="34" y="102" font-size="17" fill="#e0eee8">Check several factors rather than treating one feature as destiny.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">The claim</text><text x="54" y="234" font-size="17" fill="#243b3b">What did an official or</text><text x="54" y="261" font-size="17" fill="#243b3b">institution say it could</text><text x="54" y="288" font-size="17" fill="#243b3b">command?</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">The evidence</text><text x="369" y="234" font-size="17" fill="#243b3b">Where and when did actions</text><text x="369" y="261" font-size="17" fill="#243b3b">occur? What resources and</text><text x="369" y="288" font-size="17" fill="#243b3b">connections were needed?</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">The response</text><text x="684" y="234" font-size="17" fill="#243b3b">Who complied, negotiated or</text><text x="684" y="261" font-size="17" fill="#243b3b">resisted? What remains</text><text x="684" y="288" font-size="17" fill="#243b3b">unknown?</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not an original source, precise boundary map or portrait.</text></g></svg>