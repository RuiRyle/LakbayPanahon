<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Compare place, find and supported conclusion</title><desc>Tabon card: Palawan, Homo sapiens remains and stone tools. Callao card: Cagayan on Luzon, teeth and bones identified as Homo luzonensis in a 2019 study. These are source summaries, not reconstructed faces or original finds.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Compare place, find and supported conclusion</text><rect x="35" y="100" width="445" height="440" rx="18" fill="#e4e8dc"/><rect x="520" y="100" width="445" height="440" rx="18" fill="#dbecef"/><text x="60" y="150" font-size="28">TABON</text><text x="60" y="205" font-size="23">Place: Palawan</text><text x="60" y="260" font-size="23">Finds: human remains, tools</text><text x="60" y="315" font-size="26">Homo sapiens</text><text x="60" y="380" font-size="21">Supports presence of our species</text><text x="60" y="420" font-size="21">Does not identify every ancestor</text><text x="545" y="150" font-size="28">CALLAO</text><text x="545" y="205" font-size="23">Place: Cagayan, Luzon</text><text x="545" y="260" font-size="23">Finds: teeth and bones</text><text x="545" y="315" font-size="26">Homo luzonensis</text><text x="545" y="380" font-size="21">Species described in 2019</text><text x="545" y="420" font-size="21">2019 is not the fossils' age</text><text x="60" y="575" font-size="23">Read the source, keep the place label, and state a limit.</text><text x="35" y="615" font-size="19">Teaching summaries and models, not photographs of original finds.</text></g></svg>