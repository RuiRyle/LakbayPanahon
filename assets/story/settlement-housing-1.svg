<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="t d"><title id="t">Connected Places in a Settlement</title><desc id="d">A fictional grid with homes, a work area, an open space and a public building. Lines show possible connections, not actual Vigan streets or resident journeys.</desc><rect width="800" height="550" rx="24" fill="#eee2c7"/><g font-family="sans-serif" fill="#244c48"><text x="35" y="55" font-size="26">Connected Places in a Settlement</text><text x="35" y="87" font-size="16">Fictional teaching model / Not a measured historical plan</text><path d="M60 210H740M60 370H740M260 120V450M540 120V450" stroke="#c1a978" stroke-width="24"/><g fill="#fff8e8" stroke="#9b7a42"><rect x="70" y="120" width="160" height="65" rx="8"/><rect x="570" y="120" width="160" height="65" rx="8"/><rect x="300" y="245" width="200" height="90" rx="8"/><rect x="70" y="400" width="160" height="60" rx="8"/><rect x="570" y="400" width="160" height="60" rx="8"/></g><g font-size="20" text-anchor="middle"><text x="150" y="161">Homes</text><text x="650" y="161">Work area</text><text x="400" y="297">Open space</text><text x="150" y="438">Homes</text><text x="650" y="438">Public building</text></g><text x="35" y="510" font-size="17">Check dated evidence for a particular place and building.</text></g></svg>