<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Connections Could Support Local Affairs</title><desc id="d">Interaction: A community could have outside connections while maintaining local affairs.. Different questions: Exchange and political authority need their own evidence.. Uneven experience: A connection alone does not prove equal benefits or universal agreement.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Connections Could Support Local Affairs</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Interaction</text><text x="22" y="59" font-size="16" fill="#383d38">A community could have outside connections while maintaining</text><text x="22" y="80" font-size="16" fill="#383d38">local affairs.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Different questions</text><text x="22" y="59" font-size="16" fill="#383d38">Exchange and political authority need their own evidence.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Uneven experience</text><text x="22" y="59" font-size="16" fill="#383d38">A connection alone does not prove equal benefits or universal</text><text x="22" y="80" font-size="16" fill="#383d38">agreement.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the community, action and supporting evidence.</text></g></svg>