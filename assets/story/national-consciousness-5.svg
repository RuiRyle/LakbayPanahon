<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Build a Lesson from Order</title><desc id="desc">Modern teaching cards: Order: Keep each record in its own period.. Connection: Explain the particular relationship each source supports.. Limit: A timeline is not proof of a single cause or one universal moment of awareness.</desc><rect width="760" height="610" rx="26" fill="#163e38"/><text x="42" y="54" fill="#ebcc83" font-family="sans-serif" font-size="16">HISTORY EVIDENCE JOURNAL</text><text x="42" y="103" fill="#fff5da" font-family="sans-serif" font-size="25">Build a Lesson from Order</text><rect x="42" y="145" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="175" fill="#61431e" font-family="sans-serif" font-size="20">Order</text><text x="65" y="202" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Keep each record in its own period.</tspan></text><rect x="42" y="275" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="305" fill="#61431e" font-family="sans-serif" font-size="20">Connection</text><text x="65" y="332" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Explain the particular relationship each source supports.</tspan></text><rect x="42" y="405" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="435" fill="#61431e" font-family="sans-serif" font-size="20">Limit</text><text x="65" y="462" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">A timeline is not proof of a single cause or one universal</tspan><tspan x="65" dy="22">moment of awareness.</tspan></text><text x="42" y="581" fill="#fff5da" font-family="sans-serif" font-size="14">Modern learning diagram - not an original historical source</text></svg>