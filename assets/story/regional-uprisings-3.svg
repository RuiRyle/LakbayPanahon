<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Sumuroy: Forced Labor and Abuses</title><desc id="d">Named beginning: The marker links Palapag and 1 June 1649 with Sumuroys uprising.. Grievance: Forced labor and abuses are named concerns.. Spread and scope: A wider affected area does not prove universal participation or identical local experience.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Sumuroy: Forced Labor and Abuses</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Named beginning</text><text x="22" y="59" font-size="16" fill="#383d38">The marker links Palapag and 1 June 1649 with Sumuroys</text><text x="22" y="80" font-size="16" fill="#383d38">uprising.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Grievance</text><text x="22" y="59" font-size="16" fill="#383d38">Forced labor and abuses are named concerns.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Spread and scope</text><text x="22" y="59" font-size="16" fill="#383d38">A wider affected area does not prove universal participation</text><text x="22" y="80" font-size="16" fill="#383d38">or identical local experience.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare place, period, concern, action and source.</text></g></svg>