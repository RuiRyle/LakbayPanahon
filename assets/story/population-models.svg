<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Two research views, different questions</title><desc>Language dispersal asks how related languages spread. Population history asks about people across generations and multiple movements. The views are not complete records of every journey or family.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Two research views, different questions</text><rect x="35" y="100" width="445" height="390" rx="18" fill="#e4e8dc"/><rect x="520" y="100" width="445" height="390" rx="18" fill="#dbecef"/><text x="60" y="150" font-size="25">LANGUAGE DISPERSAL</text><text x="60" y="220" font-size="22">How did related languages spread?</text><text x="60" y="280" font-size="22">Compare language patterns</text><text x="60" y="330" font-size="22">Study contact and language learning</text><text x="60" y="420" font-size="21">Not every ancestor's travel route</text><text x="545" y="150" font-size="25">POPULATION HISTORY</text><text x="545" y="220" font-size="22">How did populations change?</text><text x="545" y="280" font-size="22">Study inherited patterns</text><text x="545" y="330" font-size="22">Compare multiple movements</text><text x="545" y="420" font-size="21">Not every family's complete record</text><text x="60" y="550" font-size="25">Earlier presence + later movements + contact and change</text><text x="35" y="617" font-size="19">Teaching summary: compare questions, evidence and limits.</text></g></svg>