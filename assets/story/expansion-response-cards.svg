<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Look at actions and context</title><desc id="desc">Fictional thinking prompts, not original historical speeches. Negotiation: People discuss particular terms. This need not settle every future demand.. Adaptation: A practice changes. The change alone does not show approval of every policy.. Resistance: People oppose a demand. Responses can differ or change; check pressure and context.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Look at actions and context</text><text x="34" y="102" font-size="17" fill="#e0eee8">Fictional thinking prompts, not original historical speeches.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">Negotiation</text><text x="54" y="234" font-size="17" fill="#243b3b">People discuss particular</text><text x="54" y="261" font-size="17" fill="#243b3b">terms. This need not settle</text><text x="54" y="288" font-size="17" fill="#243b3b">every future demand.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Adaptation</text><text x="369" y="234" font-size="17" fill="#243b3b">A practice changes. The</text><text x="369" y="261" font-size="17" fill="#243b3b">change alone does not show</text><text x="369" y="288" font-size="17" fill="#243b3b">approval of every policy.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Resistance</text><text x="684" y="234" font-size="17" fill="#243b3b">People oppose a demand.</text><text x="684" y="261" font-size="17" fill="#243b3b">Responses can differ or</text><text x="684" y="288" font-size="17" fill="#243b3b">change; check pressure and</text><text x="684" y="315" font-size="17" fill="#243b3b">context.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not an original source, precise boundary map or portrait.</text></g></svg>