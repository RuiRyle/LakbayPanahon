<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Gabriela Silang Continued the Movement</title><desc id="d">Named action: The marker records Gabrielas continuation of the Ilocos uprising.. Sequence: The leadership change belongs to 1763.. Source limit: A later marker does not supply every meeting, member or private motive.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Gabriela Silang Continued the Movement</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Named action</text><text x="22" y="59" font-size="16" fill="#383d38">The marker records Gabrielas continuation of the Ilocos</text><text x="22" y="80" font-size="16" fill="#383d38">uprising.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Sequence</text><text x="22" y="59" font-size="16" fill="#383d38">The leadership change belongs to 1763.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Source limit</text><text x="22" y="59" font-size="16" fill="#383d38">A later marker does not supply every meeting, member or</text><text x="22" y="80" font-size="16" fill="#383d38">private motive.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Identify people, actions, conditions and evidence.</text></g></svg>