<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A voyage continued after Mactan</title><desc id="desc">Selected sequence, not a complete route or crew list. 1521: Mactan: Magellan died. Surviving members continued the expedition.. The voyage continued: Leadership and crew changed. It was not one person's journey alone.. 1522: Victoria returned: Elcano and the returning crew completed the circumnavigation.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">A voyage continued after Mactan</text><text x="34" y="102" font-size="17" fill="#e0eee8">Selected sequence, not a complete route or crew list.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">1521: Mactan</text><text x="54" y="234" font-size="17" fill="#243b3b">Magellan died. Surviving</text><text x="54" y="261" font-size="17" fill="#243b3b">members continued the</text><text x="54" y="288" font-size="17" fill="#243b3b">expedition.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">The voyage continued</text><text x="369" y="234" font-size="17" fill="#243b3b">Leadership and crew changed.</text><text x="369" y="261" font-size="17" fill="#243b3b">It was not one person's</text><text x="369" y="288" font-size="17" fill="#243b3b">journey alone.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">1522: Victoria returned</text><text x="684" y="234" font-size="17" fill="#243b3b">Elcano and the returning crew</text><text x="684" y="261" font-size="17" fill="#243b3b">completed the</text><text x="684" y="288" font-size="17" fill="#243b3b">circumnavigation.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not a geographic map or original historical quotation.</text></g></svg>