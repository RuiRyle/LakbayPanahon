<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Fictional case: people can adapt an idea</title><desc>Before: makers have skills and a basket form. Contact: they consider a demonstrated handle arrangement. Adaptation: test a suitable local version while retaining useful features. This is invented for teaching.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Fictional case: people can adapt an idea</text><rect x="35" y="130" width="290" height="340" rx="18" fill="#e4e8dc"/><text x="50" y="190" font-size="25">BEFORE</text><text x="50" y="260" font-size="21">Existing making skills</text><text x="50" y="315" font-size="21">A familiar basket form</text><rect x="355" y="130" width="290" height="340" rx="18" fill="#dbecef"/><text x="370" y="190" font-size="25">CONTACT</text><text x="370" y="260" font-size="21">Consider a new idea</text><text x="370" y="315" font-size="21">A handle demonstration</text><rect x="675" y="130" width="290" height="340" rx="18" fill="#e4e8dc"/><text x="690" y="190" font-size="25">ADAPTATION</text><text x="690" y="260" font-size="21">Use local materials</text><text x="690" y="315" font-size="21">Keep useful features</text><text x="45" y="555" font-size="21">Teaching model: not a sacred pattern, an original object or an invention record.</text></g></svg>