<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Build a Participation Portfolio</title><desc id="d">Question: Ask who is recorded and which action the source describes.. Stages: Continuation does not mean one founder personally led every stage.. Limits: A source about one leader or place is not every participants complete story.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Build a Participation Portfolio</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Question</text><text x="22" y="59" font-size="16" fill="#383d38">Ask who is recorded and which action the source describes.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Stages</text><text x="22" y="59" font-size="16" fill="#383d38">Continuation does not mean one founder personally led every</text><text x="22" y="80" font-size="16" fill="#383d38">stage.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Limits</text><text x="22" y="59" font-size="16" fill="#383d38">A source about one leader or place is not every participants</text><text x="22" y="80" font-size="16" fill="#383d38">complete story.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Identify people, actions, conditions and evidence.</text></g></svg>