<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Ask what changed for people</title><desc id="desc">Identify the action: What was required or carried out? Use evidence, not only the policy name.. Check the consequence: Who was affected, where and when? Different households could have different experiences.. Avoid a leap: One record does not reveal every person's motives or establish universal consent.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Ask what changed for people</text><text x="34" y="103" font-size="17" fill="#e0eee8">Teaching guide: distinguish the claim, its evidence and its limits.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Identify the action</text><text x="54" y="235" font-size="17" fill="#243b3b">What was required or carried</text><text x="54" y="262" font-size="17" fill="#243b3b">out? Use evidence, not only</text><text x="54" y="289" font-size="17" fill="#243b3b">the policy name.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Check the consequence</text><text x="369" y="235" font-size="17" fill="#243b3b">Who was affected, where and</text><text x="369" y="262" font-size="17" fill="#243b3b">when? Different households</text><text x="369" y="289" font-size="17" fill="#243b3b">could have different</text><text x="369" y="316" font-size="17" fill="#243b3b">experiences.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Avoid a leap</text><text x="684" y="235" font-size="17" fill="#243b3b">One record does not reveal</text><text x="684" y="262" font-size="17" fill="#243b3b">every person's motives or</text><text x="684" y="289" font-size="17" fill="#243b3b">establish universal consent.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram, not an original historical document or quotation.</text></g></svg>