<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Support Had to Become an Action</title><desc id="desc">Material support: Patronage could provide resources for missionary activity. An allocation is different from its actual use.. Trace the stages: Check the promise, delivery and use separately rather than assume all three occurred identically.. Check the effect: Funding alone does not reveal every community's benefits, burdens or beliefs.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Support Had to Become an Action</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare institutional relationships with evidence of actual practice.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Material support</text><text x="54" y="249" font-size="16" fill="#243b3b">Patronage could provide</text><text x="54" y="273" font-size="16" fill="#243b3b">resources for missionary</text><text x="54" y="297" font-size="16" fill="#243b3b">activity. An allocation is</text><text x="54" y="321" font-size="16" fill="#243b3b">different from its actual</text><text x="54" y="345" font-size="16" fill="#243b3b">use.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Trace the stages</text><text x="369" y="249" font-size="16" fill="#243b3b">Check the promise, delivery</text><text x="369" y="273" font-size="16" fill="#243b3b">and use separately rather</text><text x="369" y="297" font-size="16" fill="#243b3b">than assume all three</text><text x="369" y="321" font-size="16" fill="#243b3b">occurred identically.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Check the effect</text><text x="684" y="249" font-size="16" fill="#243b3b">Funding alone does not reveal</text><text x="684" y="273" font-size="16" fill="#243b3b">every community's benefits,</text><text x="684" y="297" font-size="16" fill="#243b3b">burdens or beliefs.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original allocation, appointment or ruling.</text></g></svg>