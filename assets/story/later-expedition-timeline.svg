<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Three later expedition departures</title><desc id="desc">Dates label departures. Journeys and arrival dates are separate. Loaisa: 1525: A separate later expedition. Do not treat all voyages as the same fleet.. Saavedra: 1527: Later than Loaisa. Event order does not establish identical routes or results.. Villalobos: 1542: Departed Mexico in 1542; reached the Philippine region in 1543.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Three later expedition departures</text><text x="34" y="102" font-size="17" fill="#e0eee8">Dates label departures. Journeys and arrival dates are separate.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">Loaisa: 1525</text><text x="54" y="234" font-size="17" fill="#243b3b">A separate later expedition.</text><text x="54" y="261" font-size="17" fill="#243b3b">Do not treat all voyages as</text><text x="54" y="288" font-size="17" fill="#243b3b">the same fleet.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Saavedra: 1527</text><text x="369" y="234" font-size="17" fill="#243b3b">Later than Loaisa. Event</text><text x="369" y="261" font-size="17" fill="#243b3b">order does not establish</text><text x="369" y="288" font-size="17" fill="#243b3b">identical routes or results.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Villalobos: 1542</text><text x="684" y="234" font-size="17" fill="#243b3b">Departed Mexico in 1542;</text><text x="684" y="261" font-size="17" fill="#243b3b">reached the Philippine region</text><text x="684" y="288" font-size="17" fill="#243b3b">in 1543.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not a geographic map or original historical quotation.</text></g></svg>