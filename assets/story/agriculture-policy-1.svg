<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Crops Had Different Uses</title><desc id="d">Uses: Harvests could meet household needs and supply products for sale.. Cash crop: The term concerns production for sale, not guaranteed wealth.. Ask about costs: Sales received are not the same as income left after costs.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Crops Had Different Uses</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Uses</text><text x="22" y="59" font-size="16" fill="#383d38">Harvests could meet household needs and supply products for</text><text x="22" y="80" font-size="16" fill="#383d38">sale.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Cash crop</text><text x="22" y="59" font-size="16" fill="#383d38">The term concerns production for sale, not guaranteed wealth.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Ask about costs</text><text x="22" y="59" font-size="16" fill="#383d38">Sales received are not the same as income left after costs.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check uses, rules, costs and choices.</text></g></svg>