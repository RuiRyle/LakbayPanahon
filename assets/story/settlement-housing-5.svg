<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Buildings Have Histories Too</title><desc id="d">Different dates: Settlement beginnings, construction, alteration and repair can belong to different periods.. Record before repair: Documentation helps keep evidence of features and changes visible.. Modern evidence: A conservation report is not automatic proof of every earlier appearance.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Buildings Have Histories Too</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Different dates</text><text x="22" y="59" font-size="16" fill="#383d38">Settlement beginnings, construction, alteration and repair can</text><text x="22" y="80" font-size="16" fill="#383d38">belong to different periods.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Record before repair</text><text x="22" y="59" font-size="16" fill="#383d38">Documentation helps keep evidence of features and changes</text><text x="22" y="80" font-size="16" fill="#383d38">visible.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Modern evidence</text><text x="22" y="59" font-size="16" fill="#383d38">A conservation report is not automatic proof of every earlier</text><text x="22" y="80" font-size="16" fill="#383d38">appearance.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check layout, materials, use and dates.</text></g></svg>