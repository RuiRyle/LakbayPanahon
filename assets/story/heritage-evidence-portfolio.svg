<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Connect contributions through named sources</title><desc>Butuan boat evidence supports construction questions; copperplate evidence supports writing questions; craft descriptions support making-knowledge questions. Distinct contexts, not one event.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Connect contributions through named sources</text><rect x="35" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="50" y="210" font-size="25">BOATS</text><text x="50" y="290" font-size="21">Butuan remains</text><text x="50" y="340" font-size="21">Construction knowledge</text><rect x="355" y="140" width="290" height="300" rx="18" fill="#dbecef"/><text x="370" y="210" font-size="25">WRITING</text><text x="370" y="290" font-size="21">Laguna Copperplate</text><text x="370" y="340" font-size="21">A writing source</text><rect x="675" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="690" y="210" font-size="25">MAKING</text><text x="690" y="290" font-size="21">Material preparation</text><text x="690" y="340" font-size="21">Learned techniques</text><text x="45" y="545" font-size="22">Keep each source and context distinct. State what remains uncertain.</text></g></svg>