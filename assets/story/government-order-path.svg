<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Follow the evidence of an order</title><desc id="desc">1. Issue: A decision is recorded. This does not establish all later effects.. 2. Delivery: A message reaches a place. Delivery is not identical to obedience.. 3. Implementation: Investigate what was carried out and how affected people responded.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Follow the evidence of an order</text><text x="34" y="103" font-size="17" fill="#e0eee8">Simplified teaching guide, not an unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">1. Issue</text><text x="54" y="235" font-size="17" fill="#243b3b">A decision is recorded. This</text><text x="54" y="262" font-size="17" fill="#243b3b">does not establish all later</text><text x="54" y="289" font-size="17" fill="#243b3b">effects.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">2. Delivery</text><text x="369" y="235" font-size="17" fill="#243b3b">A message reaches a place.</text><text x="369" y="262" font-size="17" fill="#243b3b">Delivery is not identical to</text><text x="369" y="289" font-size="17" fill="#243b3b">obedience.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">3. Implementation</text><text x="684" y="235" font-size="17" fill="#243b3b">Investigate what was carried</text><text x="684" y="262" font-size="17" fill="#243b3b">out and how affected people</text><text x="684" y="289" font-size="17" fill="#243b3b">responded.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram. Not a complete organization chart or original historical order.</text></g></svg>