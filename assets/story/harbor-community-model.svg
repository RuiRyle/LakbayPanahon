<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>A harbor needs routes, work and relationships</title><desc>Fictional relationship model shows river, landing place and sea, supported by food producers, makers and boat workers. This is not a map of ancient Butuan.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">A harbor needs routes, work and relationships</text><rect x="35" y="120" width="290" height="100" rx="16" fill="#dbecef"/><text x="60" y="180" font-size="26">Inland river</text><rect x="355" y="120" width="290" height="100" rx="16" fill="#dbecef"/><text x="380" y="180" font-size="26">Landing place</text><rect x="675" y="120" width="290" height="100" rx="16" fill="#dbecef"/><text x="700" y="180" font-size="26">Coastal sea</text><path d="M325 170H355M645 170H675M500 220V330" stroke="#9d7b43" stroke-width="5"/><rect x="35" y="330" width="290" height="100" rx="16" fill="#e4e8dc"/><text x="60" y="390" font-size="26">Food producers</text><rect x="355" y="330" width="290" height="100" rx="16" fill="#e4e8dc"/><text x="380" y="390" font-size="26">Makers</text><rect x="675" y="330" width="290" height="100" rx="16" fill="#e4e8dc"/><text x="700" y="390" font-size="26">Boat workers</text><path d="M180 330V275H820V330" fill="none" stroke="#9d7b43" stroke-width="4"/><text x="65" y="525" font-size="23">Location offers opportunities; people and supplies support exchange.</text><text x="35" y="615" font-size="20">Teaching model or summary: not a site map or a record of one event.</text></g></svg>