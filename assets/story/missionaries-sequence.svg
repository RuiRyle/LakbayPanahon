<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Earlier Encounters and Continuing Work</title><desc id="desc">Separate periods: The 1521 expedition and the 1565 arrival of Augustinian friars belong to distinct events and stages.. A named example: The NHCP marker identifies Augustinians led by Urdaneta arriving with the 1565 expedition.. An arrival has limits: An arrival record does not establish conversion of every community or every individual's private belief.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Earlier Encounters and Continuing Work</text><text x="34" y="103" font-size="17" fill="#e0eee8">Study historical evidence respectfully. No religious practice is required.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Separate periods</text><text x="54" y="249" font-size="16" fill="#243b3b">The 1521 expedition and the</text><text x="54" y="273" font-size="16" fill="#243b3b">1565 arrival of Augustinian</text><text x="54" y="297" font-size="16" fill="#243b3b">friars belong to distinct</text><text x="54" y="321" font-size="16" fill="#243b3b">events and stages.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A named example</text><text x="369" y="249" font-size="16" fill="#243b3b">The NHCP marker identifies</text><text x="369" y="273" font-size="16" fill="#243b3b">Augustinians led by Urdaneta</text><text x="369" y="297" font-size="16" fill="#243b3b">arriving with the 1565</text><text x="369" y="321" font-size="16" fill="#243b3b">expedition.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">An arrival has limits</text><text x="684" y="249" font-size="16" fill="#243b3b">An arrival record does not</text><text x="684" y="273" font-size="16" fill="#243b3b">establish conversion of every</text><text x="684" y="297" font-size="16" fill="#243b3b">community or every</text><text x="684" y="321" font-size="16" fill="#243b3b">individual's private belief.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original page, ceremony image or historical quotation.</text></g></svg>