<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A base needs connections</title><desc id="desc">Conceptual chain: not an exact route or a map of universal control. A governing base: An official can issue decisions. That is only one step toward action elsewhere.. Links and resources: People carry messages, maintain relationships and move supplies.. Actual effect: Ask where a decision was carried out and how people responded.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">A base needs connections</text><text x="34" y="102" font-size="17" fill="#e0eee8">Conceptual chain: not an exact route or a map of universal control.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">A governing base</text><text x="54" y="234" font-size="17" fill="#243b3b">An official can issue</text><text x="54" y="261" font-size="17" fill="#243b3b">decisions. That is only one</text><text x="54" y="288" font-size="17" fill="#243b3b">step toward action elsewhere.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Links and resources</text><text x="369" y="234" font-size="17" fill="#243b3b">People carry messages,</text><text x="369" y="261" font-size="17" fill="#243b3b">maintain relationships and</text><text x="369" y="288" font-size="17" fill="#243b3b">move supplies.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Actual effect</text><text x="684" y="234" font-size="17" fill="#243b3b">Ask where a decision was</text><text x="684" y="261" font-size="17" fill="#243b3b">carried out and how people</text><text x="684" y="288" font-size="17" fill="#243b3b">responded.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not an original source, precise boundary map or portrait.</text></g></svg>