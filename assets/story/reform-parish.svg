<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc"><title id="title">UNDERSTAND THE PARISH ROLE</title><desc id="desc">COMMUNITY: Parish: People and duties. SERVICE: Priest: Continuing responsibilities. WIDER AREA: Diocese: Under a bishop. An institution includes people and responsibilities, not only a building.</desc><rect width="1060" height="590" rx="28" fill="#f6efd9"/><g font-family="system-ui,sans-serif"><text x="40" y="66" fill="#355742" font-size="28" font-weight="800">UNDERSTAND THE PARISH ROLE</text><path d="M24 95H1036" stroke="#c8b47e" stroke-width="2"/><g><rect x="38" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="56" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="186" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">COMMUNITY</text><text x="186" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Parish</text><text x="186" y="366" text-anchor="middle" fill="#59674f" font-size="19">People and duties</text></g><g><rect x="368" y="160" width="296" height="290" rx="22" fill="#e5efdf" stroke="#b6c6a6" stroke-width="2"/><rect x="386" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="516" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">SERVICE</text><text x="516" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Priest</text><text x="516" y="366" text-anchor="middle" fill="#59674f" font-size="19">Continuing responsibilities</text></g><g><rect x="698" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="716" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="846" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">WIDER AREA</text><text x="846" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Diocese</text><text x="846" y="366" text-anchor="middle" fill="#59674f" font-size="19">Under a bishop</text></g><text x="40" y="510" fill="#526149" font-size="21">An institution includes people and responsibilities, not only a building.</text><text x="40" y="553" fill="#786644" font-size="18">Modern teaching diagram - identify roles, concerns and requests.</text></g></svg>
