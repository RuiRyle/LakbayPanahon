<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc"><title id="title">EXPLAIN THE REFORM TERMS</title><desc id="desc">TERM: Secularization: Parish administration. TERM: Filipinization: Filipino participation. TASK: Connect terms: Explain the difference. The dispute concerns leadership and participation, not removing religion.</desc><rect width="1060" height="590" rx="28" fill="#f6efd9"/><g font-family="system-ui,sans-serif"><text x="40" y="66" fill="#355742" font-size="28" font-weight="800">EXPLAIN THE REFORM TERMS</text><path d="M24 95H1036" stroke="#c8b47e" stroke-width="2"/><g><rect x="38" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="56" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="186" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">TERM</text><text x="186" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Secularization</text><text x="186" y="366" text-anchor="middle" fill="#59674f" font-size="19">Parish administration</text></g><g><rect x="368" y="160" width="296" height="290" rx="22" fill="#e5efdf" stroke="#b6c6a6" stroke-width="2"/><rect x="386" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="516" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">TERM</text><text x="516" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Filipinization</text><text x="516" y="366" text-anchor="middle" fill="#59674f" font-size="19">Filipino participation</text></g><g><rect x="698" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="716" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="846" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">TASK</text><text x="846" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Connect terms</text><text x="846" y="366" text-anchor="middle" fill="#59674f" font-size="19">Explain the difference</text></g><text x="40" y="510" fill="#526149" font-size="21">The dispute concerns leadership and participation, not removing religion.</text><text x="40" y="553" fill="#786644" font-size="18">Modern teaching diagram - identify roles, concerns and requests.</text></g></svg>
