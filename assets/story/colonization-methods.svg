<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Methods need context</title><desc id="desc">Institutions: Offices and religious institutions could support a continuing presence.. Demands and force: A required payment is not automatically a gift. Identify pressure and coercion.. Local responses: People could negotiate, adapt or resist. Operation varied by place and period.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Methods need context</text><text x="34" y="103" font-size="17" fill="#e0eee8">Teaching guide: distinguish the claim, its evidence and its limits.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Institutions</text><text x="54" y="235" font-size="17" fill="#243b3b">Offices and religious</text><text x="54" y="262" font-size="17" fill="#243b3b">institutions could support a</text><text x="54" y="289" font-size="17" fill="#243b3b">continuing presence.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Demands and force</text><text x="369" y="235" font-size="17" fill="#243b3b">A required payment is not</text><text x="369" y="262" font-size="17" fill="#243b3b">automatically a gift.</text><text x="369" y="289" font-size="17" fill="#243b3b">Identify pressure and</text><text x="369" y="316" font-size="17" fill="#243b3b">coercion.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Local responses</text><text x="684" y="235" font-size="17" fill="#243b3b">People could negotiate, adapt</text><text x="684" y="262" font-size="17" fill="#243b3b">or resist. Operation varied</text><text x="684" y="289" font-size="17" fill="#243b3b">by place and period.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram, not an original historical document or quotation.</text></g></svg>