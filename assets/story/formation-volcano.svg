<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Worked model: volcanic material can build land</title><desc>Three stages show material reaching the surface, cooling and accumulating. Stage sizes and timing are symbolic, not a prediction about any real volcano.</desc><rect width="1000" height="620" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="29">Worked model: volcanic material can build land</text><rect x="35" y="100" width="295" height="400" rx="15" fill="#dbecef"/><text x="50" y="140" font-size="23">1. Material rises</text><path d="M45 390H320V470H45Z" fill="#b79a70"/><path d="M70 390L180 340L290 390Z" fill="#567e65"/><path d="M180 455V340" stroke="#b64f36" stroke-width="12"/><text x="60" y="495" font-size="18">Magma below the surface</text><rect x="355" y="100" width="295" height="400" rx="15" fill="#dbecef"/><text x="370" y="140" font-size="23">2. Material cools</text><path d="M365 390H640V470H365Z" fill="#b79a70"/><path d="M390 390L500 275L610 390Z" fill="#567e65"/><path d="M500 455V275" stroke="#b64f36" stroke-width="12"/><text x="380" y="495" font-size="18">Cooled material adds rock</text><rect x="675" y="100" width="295" height="400" rx="15" fill="#dbecef"/><text x="690" y="140" font-size="23">3. Material builds</text><path d="M685 390H960V470H685Z" fill="#b79a70"/><path d="M710 390L820 210L930 390Z" fill="#567e65"/><path d="M820 455V210" stroke="#b64f36" stroke-width="12"/><text x="700" y="495" font-size="18">Cooled material adds rock</text><text x="35" y="575" font-size="19">Simplified classroom model, not to scale. Not a map or eruption forecast.</text></g></svg>