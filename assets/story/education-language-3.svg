<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Language Helped Communication</title><desc id="d">Communication: Language is one part of how a message reaches a learner.. Meaning: Translation concerns expressing meaning in another language.. Scope: One bilingual text does not prove everyones language ability or identical understanding.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Language Helped Communication</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Communication</text><text x="22" y="59" font-size="16" fill="#383d38">Language is one part of how a message reaches a learner.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Meaning</text><text x="22" y="59" font-size="16" fill="#383d38">Translation concerns expressing meaning in another language.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Scope</text><text x="22" y="59" font-size="16" fill="#383d38">One bilingual text does not prove everyones language ability</text><text x="22" y="80" font-size="16" fill="#383d38">or identical understanding.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check materials, access, learning and responses.</text></g></svg>