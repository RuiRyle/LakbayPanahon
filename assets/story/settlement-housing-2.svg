<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">A House Could Combine Materials</title><desc id="d">Combination: Bahay na bato examples can combine masonry and wood.. Local work: Regional forms and local craftsmanship matter.. No universal house: One house type does not describe every familys dwelling.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">A House Could Combine Materials</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Combination</text><text x="22" y="59" font-size="16" fill="#383d38">Bahay na bato examples can combine masonry and wood.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Local work</text><text x="22" y="59" font-size="16" fill="#383d38">Regional forms and local craftsmanship matter.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. No universal house</text><text x="22" y="59" font-size="16" fill="#383d38">One house type does not describe every familys dwelling.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check layout, materials, use and dates.</text></g></svg>