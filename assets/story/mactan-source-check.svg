<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Check the exhibit caption</title><desc id="desc">A compelling picture is not proof of every detail it shows.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Check the exhibit caption</text><text x="34" y="101" font-size="17" fill="#e0eee8">A compelling picture is not proof of every detail it shows.</text><rect x="34" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="190" fill="#76451f" font-size="20" font-weight="bold">Participant account</text><text x="54" y="230" font-size="17" fill="#243b3b">Pigafetta witnessed the</text><text x="54" y="257" font-size="17" fill="#243b3b">battle, but did not record</text><text x="54" y="284" font-size="17" fill="#243b3b">every viewpoint.</text><rect x="349" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="190" fill="#76451f" font-size="20" font-weight="bold">Modern summary</text><text x="369" y="230" font-size="17" fill="#243b3b">An NHCP marker summarizes</text><text x="369" y="257" font-size="17" fill="#243b3b">historical work. It was not</text><text x="369" y="284" font-size="17" fill="#243b3b">installed during the battle.</text><rect x="664" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="190" fill="#76451f" font-size="20" font-weight="bold">Artistic retelling</text><text x="684" y="230" font-size="17" fill="#243b3b">A monument can honor</text><text x="684" y="257" font-size="17" fill="#243b3b">resistance. A pictured duel</text><text x="684" y="284" font-size="17" fill="#243b3b">or speech still needs</text><text x="684" y="311" font-size="17" fill="#243b3b">evidence.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. No exact scale, portraits or original dialogue.</text></g></svg>