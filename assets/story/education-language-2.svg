<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Investigate a Named Teaching Book</title><desc id="d">Named material: The Doctrina Christiana is a dated Catholic teaching text printed in Manila in 1593.. Languages: The catalog describes Spanish and Tagalog.. Reception limit: A printed book does not establish every persons reading, understanding or belief.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Investigate a Named Teaching Book</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Named material</text><text x="22" y="59" font-size="16" fill="#383d38">The Doctrina Christiana is a dated Catholic teaching text</text><text x="22" y="80" font-size="16" fill="#383d38">printed in Manila in 1593.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Languages</text><text x="22" y="59" font-size="16" fill="#383d38">The catalog describes Spanish and Tagalog.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Reception limit</text><text x="22" y="59" font-size="16" fill="#383d38">A printed book does not establish every persons reading,</text><text x="22" y="80" font-size="16" fill="#383d38">understanding or belief.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check materials, access, learning and responses.</text></g></svg>