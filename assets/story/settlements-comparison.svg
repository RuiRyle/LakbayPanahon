<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Compare the same questions for two places</title><desc id="desc">Cebu: Spanish settlement in 1565. Manila: Spanish city in 1571. Both places had earlier communities. Compare trade, local responses and the actual reach of authority.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Compare the same questions for two places</text><text x="34" y="102" font-size="17" fill="#e0eee8">These dates describe colonial developments, not the start of all local history.</text><rect x="35" y="145" width="450" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="59" y="190" font-size="26" font-weight="bold" fill="#31594c">Cebu</text><text x="59" y="238" font-size="33" fill="#8a6333">1565</text><text x="59" y="282" font-size="18" fill="#243b3b">Spanish settlement within an existing</text><text x="59" y="309" font-size="18" fill="#243b3b">trading community.</text><text x="59" y="386" font-size="17" fill="#5d674d">Ask: earlier community, trade, responses.</text><rect x="515" y="145" width="450" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="539" y="190" font-size="26" font-weight="bold" fill="#31594c">Manila</text><text x="539" y="238" font-size="33" fill="#8a6333">1571</text><text x="539" y="282" font-size="18" fill="#243b3b">Spanish city on the site of an earlier</text><text x="539" y="309" font-size="18" fill="#243b3b">polity.</text><text x="539" y="386" font-size="17" fill="#5d674d">Ask: earlier community, trade, responses.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model. Not a precise map, original image or historical quotation.</text></g></svg>