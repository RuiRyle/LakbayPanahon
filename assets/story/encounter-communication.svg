<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Communication helps a meeting</title><desc id="desc">Hearing a request is different from agreeing to it. A speaker: What is being asked? Do not invent the exact words of a historical person.. An interpreter: Helps people communicate across languages. Does not decide for everyone.. A listener: What response is recorded? Check evidence before writing that an agreement was reached.</desc><rect width="1000" height="490" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Communication helps a meeting</text><text x="34" y="104" font-size="18" fill="#e0eee8">Hearing a request is different from agreeing to it.</text><rect x="34" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="62" cy="184" r="13" fill="#315c56"/><text x="62" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">1</text><text x="54" y="225" fill="#76451f" font-size="19" font-weight="bold">A speaker</text><text x="54" y="259" fill="#243b3b" font-size="17">What is being asked? Do not</text><text x="54" y="285" fill="#243b3b" font-size="17">invent the exact words of a</text><text x="54" y="311" fill="#243b3b" font-size="17">historical person.</text><path d="M331 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="349" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="377" cy="184" r="13" fill="#315c56"/><text x="377" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">2</text><text x="369" y="225" fill="#76451f" font-size="19" font-weight="bold">An interpreter</text><text x="369" y="259" fill="#243b3b" font-size="17">Helps people communicate</text><text x="369" y="285" fill="#243b3b" font-size="17">across languages. Does not</text><text x="369" y="311" fill="#243b3b" font-size="17">decide for everyone.</text><path d="M646 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="664" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="692" cy="184" r="13" fill="#315c56"/><text x="692" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">3</text><text x="684" y="225" fill="#76451f" font-size="19" font-weight="bold">A listener</text><text x="684" y="259" fill="#243b3b" font-size="17">What response is recorded?</text><text x="684" y="285" fill="#243b3b" font-size="17">Check evidence before writing</text><text x="684" y="311" fill="#243b3b" font-size="17">that an agreement was</text><text x="684" y="337" fill="#243b3b" font-size="17">reached.</text><text x="34" y="461" font-size="16" fill="#e0eee8">Modern learning diagram. Not an original image or quotation from 1521.</text></g></svg>