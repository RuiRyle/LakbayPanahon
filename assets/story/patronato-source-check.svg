<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Connected Institutions Could Disagree</title><desc id="desc">Overlap: Connected responsibilities could produce cooperation as well as disagreements over authority.. A claim in context: A letter stating a jurisdictional claim is not automatically a final accepted decision.. Outcome remains a question: Compare procedures and later evidence; a dispute alone does not show who prevailed or every local effect.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Connected Institutions Could Disagree</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare institutional relationships with evidence of actual practice.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Overlap</text><text x="54" y="249" font-size="16" fill="#243b3b">Connected responsibilities</text><text x="54" y="273" font-size="16" fill="#243b3b">could produce cooperation as</text><text x="54" y="297" font-size="16" fill="#243b3b">well as disagreements over</text><text x="54" y="321" font-size="16" fill="#243b3b">authority.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A claim in context</text><text x="369" y="249" font-size="16" fill="#243b3b">A letter stating a</text><text x="369" y="273" font-size="16" fill="#243b3b">jurisdictional claim is not</text><text x="369" y="297" font-size="16" fill="#243b3b">automatically a final</text><text x="369" y="321" font-size="16" fill="#243b3b">accepted decision.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Outcome remains a question</text><text x="684" y="249" font-size="16" fill="#243b3b">Compare procedures and later</text><text x="684" y="273" font-size="16" fill="#243b3b">evidence; a dispute alone</text><text x="684" y="297" font-size="16" fill="#243b3b">does not show who prevailed</text><text x="684" y="321" font-size="16" fill="#243b3b">or every local effect.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original allocation, appointment or ruling.</text></g></svg>