<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Why Concentrate a Settlement?</title><desc id="desc">An administrative aim: A concentrated settlement could make contact, instruction or collection easier for authorities to organize.. An aim is not consent: Officials' reasons do not establish that all affected people shared those reasons.. Check actual effects: Evidence about households is needed before claiming universal benefit or harm.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Why Concentrate a Settlement?</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare plans, actual actions and effects on people.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">An administrative aim</text><text x="54" y="249" font-size="16" fill="#243b3b">A concentrated settlement</text><text x="54" y="273" font-size="16" fill="#243b3b">could make contact,</text><text x="54" y="297" font-size="16" fill="#243b3b">instruction or collection</text><text x="54" y="321" font-size="16" fill="#243b3b">easier for authorities to</text><text x="54" y="345" font-size="16" fill="#243b3b">organize.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">An aim is not consent</text><text x="369" y="249" font-size="16" fill="#243b3b">Officials' reasons do not</text><text x="369" y="273" font-size="16" fill="#243b3b">establish that all affected</text><text x="369" y="297" font-size="16" fill="#243b3b">people shared those reasons.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Check actual effects</text><text x="684" y="249" font-size="16" fill="#243b3b">Evidence about households is</text><text x="684" y="273" font-size="16" fill="#243b3b">needed before claiming</text><text x="684" y="297" font-size="16" fill="#243b3b">universal benefit or harm.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original household record or historical quotation.</text></g></svg>