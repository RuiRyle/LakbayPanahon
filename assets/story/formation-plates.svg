<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Read the plate-movement arrows</title><desc>Three symbolic panels show plates moving together, apart and past one another. Dashed lines indicate where they meet, not actual Philippine boundaries.</desc><rect width="1000" height="620" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="29">Read the plate-movement arrows</text><rect x="35" y="100" width="295" height="400" rx="15" fill="#e4e8dc"/><text x="53" y="145" font-size="25">A. Move together</text><path d="M180 180V440" stroke="#8b6844" stroke-width="6" stroke-dasharray="9 7"/><text x="70" y="290" font-size="65">→</text><text x="215" y="290" font-size="65">←</text><text x="53" y="470" font-size="20">Solid plate | solid plate</text><rect x="355" y="100" width="295" height="400" rx="15" fill="#e4e8dc"/><text x="373" y="145" font-size="25">B. Move apart</text><path d="M500 180V440" stroke="#8b6844" stroke-width="6" stroke-dasharray="9 7"/><text x="390" y="290" font-size="65">←</text><text x="535" y="290" font-size="65">→</text><text x="373" y="470" font-size="20">Solid plate | solid plate</text><rect x="675" y="100" width="295" height="400" rx="15" fill="#e4e8dc"/><text x="693" y="145" font-size="25">C. Slide past</text><path d="M820 180V440" stroke="#8b6844" stroke-width="6" stroke-dasharray="9 7"/><text x="735" y="340" font-size="65">↑</text><text x="865" y="340" font-size="65">↓</text><text x="693" y="470" font-size="20">Solid plate | solid plate</text><text x="35" y="575" font-size="19">Simplified classroom model, not to scale. Not a map or eruption forecast.</text></g></svg>