<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Tax Rules Changed Over Time</title><desc id="d">Before and after: The study distinguishes the end of tribute in 1884 from the later cedula system in 1885.. A changed system: Ending one form of taxation did not mean that all taxes ended.. Check the record: A dated payment needs the rule that applied in its own setting.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><path d="M0 50H760M0 570H760" stroke="#bd9349" stroke-width="3"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Tax Rules Changed Over Time</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Before and after</text><text x="22" y="59" font-size="16" fill="#383d38">The study distinguishes the end of tribute in 1884 from the</text><text x="22" y="80" font-size="16" fill="#383d38">later cedula system in 1885.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. A changed system</text><text x="22" y="59" font-size="16" fill="#383d38">Ending one form of taxation did not mean that all taxes ended.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Check the record</text><text x="22" y="59" font-size="16" fill="#383d38">A dated payment needs the rule that applied in its own</text><text x="22" y="80" font-size="16" fill="#383d38">setting.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check the demand, setting and source.</text></g></svg>