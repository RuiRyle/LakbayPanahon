<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Roles and Conditions Could Differ</title><desc id="d">Different conditions: Resources and pressures could affect available choices.. Recorded role: A source supports particular actions, not every part of a life.. No stereotype: Gender, religion or ancestry does not automatically determine a role or motive.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Roles and Conditions Could Differ</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Different conditions</text><text x="22" y="59" font-size="16" fill="#383d38">Resources and pressures could affect available choices.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Recorded role</text><text x="22" y="59" font-size="16" fill="#383d38">A source supports particular actions, not every part of a</text><text x="22" y="80" font-size="16" fill="#383d38">life.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. No stereotype</text><text x="22" y="59" font-size="16" fill="#383d38">Gender, religion or ancestry does not automatically determine</text><text x="22" y="80" font-size="16" fill="#383d38">a role or motive.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Identify people, actions, conditions and evidence.</text></g></svg>