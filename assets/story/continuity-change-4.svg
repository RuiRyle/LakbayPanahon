<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">People Took Part in Change</title><desc id="d">Action: People could take part in change within constraints.. Named case: The Bacolor petition is a particular recorded request in 1698.. Limits: Agency does not mean equal power, unlimited choice or automatic success.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">People Took Part in Change</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Action</text><text x="22" y="59" font-size="16" fill="#383d38">People could take part in change within constraints.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Named case</text><text x="22" y="59" font-size="16" fill="#383d38">The Bacolor petition is a particular recorded request in 1698.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Limits</text><text x="22" y="59" font-size="16" fill="#383d38">Agency does not mean equal power, unlimited choice or</text><text x="22" y="80" font-size="16" fill="#383d38">automatic success.</text></g><text x="42" y="595" font-size="14" fill="#66563b">What changed? What continued? What supports the claim?</text></g></svg>