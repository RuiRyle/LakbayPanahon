<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Start with the Reported Problem</title><desc id="d">Reported problem: A grievance concerns treatment, conditions or a demand.. Named case: The NHCP marker connects the Palapag uprising of 1649 with forced labor and abuses.. Scope: A stated grievance does not reveal every participants motive or every revolts cause.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Start with the Reported Problem</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Reported problem</text><text x="22" y="59" font-size="16" fill="#383d38">A grievance concerns treatment, conditions or a demand.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Named case</text><text x="22" y="59" font-size="16" fill="#383d38">The NHCP marker connects the Palapag uprising of 1649 with</text><text x="22" y="80" font-size="16" fill="#383d38">forced labor and abuses.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Scope</text><text x="22" y="59" font-size="16" fill="#383d38">A stated grievance does not reveal every participants motive</text><text x="22" y="80" font-size="16" fill="#383d38">or every revolts cause.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check concerns, actions, people and outcomes.</text></g></svg>