<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Religious Place and Community Life</title><desc id="desc">A named institution: The National Museum identifies the establishment of Silang as a parish in 1595.. Different dates: A parish's establishment does not date every part of a later building or present-day photograph.. Use needs evidence: A religious place does not reveal every resident's participation or experience.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Religious Place and Community Life</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare practices, objects and dated evidence without assuming private belief.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A named institution</text><text x="54" y="249" font-size="16" fill="#243b3b">The National Museum</text><text x="54" y="273" font-size="16" fill="#243b3b">identifies the establishment</text><text x="54" y="297" font-size="16" fill="#243b3b">of Silang as a parish in</text><text x="54" y="321" font-size="16" fill="#243b3b">1595.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Different dates</text><text x="369" y="249" font-size="16" fill="#243b3b">A parish's establishment does</text><text x="369" y="273" font-size="16" fill="#243b3b">not date every part of a</text><text x="369" y="297" font-size="16" fill="#243b3b">later building or present-day</text><text x="369" y="321" font-size="16" fill="#243b3b">photograph.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Use needs evidence</text><text x="684" y="249" font-size="16" fill="#243b3b">A religious place does not</text><text x="684" y="273" font-size="16" fill="#243b3b">reveal every resident's</text><text x="684" y="297" font-size="16" fill="#243b3b">participation or experience.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original artifact, ceremony image or reconstructed building.</text></g></svg>