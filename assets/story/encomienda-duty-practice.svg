<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Stated Duties and Actual Practice</title><desc id="desc">A stated obligation: Protection and religious instruction appeared among stated duties connected with collection.. A practice to investigate: A promise or written obligation does not prove that the promised action occurred.. A disputed relationship: Historical debate about collection and duties is evidence of disagreement, not every community's complete experience.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Stated Duties and Actual Practice</text><text x="34" y="103" font-size="17" fill="#e0eee8">Separate the arrangement, its practice and evidence about people.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A stated obligation</text><text x="54" y="249" font-size="16" fill="#243b3b">Protection and religious</text><text x="54" y="273" font-size="16" fill="#243b3b">instruction appeared among</text><text x="54" y="297" font-size="16" fill="#243b3b">stated duties connected with</text><text x="54" y="321" font-size="16" fill="#243b3b">collection.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A practice to investigate</text><text x="369" y="249" font-size="16" fill="#243b3b">A promise or written</text><text x="369" y="273" font-size="16" fill="#243b3b">obligation does not prove</text><text x="369" y="297" font-size="16" fill="#243b3b">that the promised action</text><text x="369" y="321" font-size="16" fill="#243b3b">occurred.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">A disputed relationship</text><text x="684" y="249" font-size="16" fill="#243b3b">Historical debate about</text><text x="684" y="273" font-size="16" fill="#243b3b">collection and duties is</text><text x="684" y="297" font-size="16" fill="#243b3b">evidence of disagreement, not</text><text x="684" y="321" font-size="16" fill="#243b3b">every community's complete</text><text x="684" y="345" font-size="16" fill="#243b3b">experience.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not a land deed, authentic receipt or universal tax schedule.</text></g></svg>