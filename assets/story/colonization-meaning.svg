<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A visit and continuing authority</title><desc id="desc">Visit: A journey reaches a place. Arrival alone does not establish continuing rule.. Colonial authority: An outside power attempts to establish and maintain authority over people and place.. Evidence of reach: Ask how authority operated, where, when and with what responses.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">A visit and continuing authority</text><text x="34" y="103" font-size="17" fill="#e0eee8">Teaching guide: distinguish the claim, its evidence and its limits.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Visit</text><text x="54" y="235" font-size="17" fill="#243b3b">A journey reaches a place.</text><text x="54" y="262" font-size="17" fill="#243b3b">Arrival alone does not</text><text x="54" y="289" font-size="17" fill="#243b3b">establish continuing rule.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Colonial authority</text><text x="369" y="235" font-size="17" fill="#243b3b">An outside power attempts to</text><text x="369" y="262" font-size="17" fill="#243b3b">establish and maintain</text><text x="369" y="289" font-size="17" fill="#243b3b">authority over people and</text><text x="369" y="316" font-size="17" fill="#243b3b">place.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Evidence of reach</text><text x="684" y="235" font-size="17" fill="#243b3b">Ask how authority operated,</text><text x="684" y="262" font-size="17" fill="#243b3b">where, when and with what</text><text x="684" y="289" font-size="17" fill="#243b3b">responses.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram, not an original historical document or quotation.</text></g></svg>