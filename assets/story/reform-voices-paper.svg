<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc"><title id="title">Open the Reform Newspaper</title><desc id="desc">Modern teaching diagram with three labelled cards. No violence is depicted.</desc><rect width="1060" height="590" rx="28" fill="#f6efd9"/><path d="M65 365H995" stroke="#b59761" stroke-width="6" stroke-dasharray="10 10"/><text x="530" y="75" text-anchor="middle" font-family="sans-serif" font-size="33" fill="#29473b">Open the Reform Newspaper</text><text x="530" y="116" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#665a45">LAKBAYPANAHON / HISTORY CASE FILE</text><g transform="translate(38,160)"><rect width="296" height="290" rx="18" fill="#fffaf0" stroke="#c7b386" stroke-width="2"/><path d="M18 0H278Q296 0 296 18V80H0V18Q0 0 18 0" fill="#315c4b"/><text x="148" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#fff7df">LA SOLIDARIDAD</text><circle cx="148" cy="150" r="34" fill="#ead8a9"/><text x="148" y="161" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#315c4b">1</text><text x="148" y="224" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#433e31">First issue: 1889</text></g><g transform="translate(368,160)"><rect width="296" height="290" rx="18" fill="#fffaf0" stroke="#c7b386" stroke-width="2"/><path d="M18 0H278Q296 0 296 18V80H0V18Q0 0 18 0" fill="#315c4b"/><text x="148" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#fff7df">ARGUMENTS</text><circle cx="148" cy="150" r="34" fill="#ead8a9"/><text x="148" y="161" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#315c4b">2</text><text x="148" y="224" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#433e31">Philippine concerns</text></g><g transform="translate(698,160)"><rect width="296" height="290" rx="18" fill="#fffaf0" stroke="#c7b386" stroke-width="2"/><path d="M18 0H278Q296 0 296 18V80H0V18Q0 0 18 0" fill="#315c4b"/><text x="148" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#fff7df">READERS</text><circle cx="148" cy="150" r="34" fill="#ead8a9"/><text x="148" y="161" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#315c4b">3</text><text x="148" y="224" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#433e31">Publication, not a law</text></g><text x="530" y="515" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#665a45">Modern learning cards, not original historical documents.</text><text x="530" y="552" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#315c4b">Read the clues. Make a connection. Explain your evidence.</text></svg>