<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">A Departure Was Not an Arrival</title><desc id="d">Departure: A ship leaving port is one recorded stage.. Follow-up: Check arrival or other later evidence for the same journey.. Case limit: One outcome does not establish the result of every crossing.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">A Departure Was Not an Arrival</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Departure</text><text x="22" y="59" font-size="16" fill="#383d38">A ship leaving port is one recorded stage.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Follow-up</text><text x="22" y="59" font-size="16" fill="#383d38">Check arrival or other later evidence for the same journey.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Case limit</text><text x="22" y="59" font-size="16" fill="#383d38">One outcome does not establish the result of every crossing.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Follow goods, people and evidence.</text></g></svg>