<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Whose view are we hearing?</title><desc id="desc">These are thinking prompts, not original historical quotations. Sponsor questions: What goods and influence do we seek? What resources will the voyage cost?. Local questions: What does contact mean for our safety, exchange and authority?. Historian questions: Whose account survives? What evidence is missing? Avoid one view for everyone.</desc><rect width="1000" height="450" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="36" y="60" font-size="28" fill="#ffe1a0">Whose view are we hearing?</text><text x="36" y="98" font-size="17" fill="#e0eee8">These are thinking prompts, not original historical quotations.</text><rect x="36" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="56" y="188" fill="#76451f" font-size="19" font-weight="bold">Sponsor questions</text><text x="56" y="225" fill="#243b3b" font-size="17">What goods and influence do we</text><text x="56" y="252" fill="#243b3b" font-size="17">seek? What resources will the</text><text x="56" y="279" fill="#243b3b" font-size="17">voyage cost?</text><rect x="346" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="366" y="188" fill="#76451f" font-size="19" font-weight="bold">Local questions</text><text x="366" y="225" fill="#243b3b" font-size="17">What does contact mean for our</text><text x="366" y="252" fill="#243b3b" font-size="17">safety, exchange and authority?</text><rect x="656" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="676" y="188" fill="#76451f" font-size="19" font-weight="bold">Historian questions</text><text x="676" y="225" fill="#243b3b" font-size="17">Whose account survives? What</text><text x="676" y="252" fill="#243b3b" font-size="17">evidence is missing? Avoid one</text><text x="676" y="279" fill="#243b3b" font-size="17">view for everyone.</text><text x="36" y="425" font-size="15" fill="#e0eee8">Teaching diagram. Explain the evidence and its limits.</text></g></svg>