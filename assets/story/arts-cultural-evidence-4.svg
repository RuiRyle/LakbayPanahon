<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">A Textile Can Carry a Later Story</title><desc id="d">Object date: The Field Museum entry dates this named textile to the early to mid-1960s.. Living story: An object can connect skills, use and memory in a later period.. Earlier claims: A modern heritage object alone does not prove every colonial-era detail.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">A Textile Can Carry a Later Story</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Object date</text><text x="22" y="59" font-size="16" fill="#383d38">The Field Museum entry dates this named textile to the early</text><text x="22" y="80" font-size="16" fill="#383d38">to mid-1960s.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Living story</text><text x="22" y="59" font-size="16" fill="#383d38">An object can connect skills, use and memory in a later</text><text x="22" y="80" font-size="16" fill="#383d38">period.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Earlier claims</text><text x="22" y="59" font-size="16" fill="#383d38">A modern heritage object alone does not prove every</text><text x="22" y="80" font-size="16" fill="#383d38">colonial-era detail.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check makers, dates, use and purpose.</text></g></svg>