<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Match the source to the question</title><desc>Archaeology examines finds and context. Language research examines language relationships. Genetic research examines inherited patterns in populations. None is a complete account of every person. No personal genetic information is required.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Match the source to the question</text><rect x="35" y="110" width="290" height="390" rx="16" fill="#e4e8dc"/><text x="50" y="160" font-size="25">OBJECTS</text><text x="50" y="230" font-size="21">Place and context</text><text x="50" y="270" font-size="21">Materials and dates</text><text x="50" y="345" font-size="20">What activity or contact?</text><text x="50" y="435" font-size="19">Not every user's identity</text><rect x="355" y="110" width="290" height="390" rx="16" fill="#dbecef"/><text x="370" y="160" font-size="25">LANGUAGES</text><text x="370" y="230" font-size="21">Vocabulary and sounds</text><text x="370" y="270" font-size="21">Shared language history</text><text x="370" y="345" font-size="20">How are they related?</text><text x="370" y="435" font-size="19">Not identical ancestry</text><rect x="675" y="110" width="290" height="390" rx="16" fill="#e4e8dc"/><text x="690" y="160" font-size="21">INHERITED PATTERNS</text><text x="690" y="230" font-size="21">Patterns across</text><text x="690" y="270" font-size="21">generations</text><text x="690" y="345" font-size="20">What population links?</text><text x="690" y="435" font-size="19">Not a ranking of people</text><text x="90" y="560" font-size="24">Use supplied evidence. No personal ancestry or DNA data required.</text><text x="35" y="617" font-size="19">Teaching summary: compare questions, evidence and limits.</text></g></svg>