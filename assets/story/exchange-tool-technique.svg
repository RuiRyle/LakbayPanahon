<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Material, technique and product are different</title><desc>Material has useful properties; technique involves learned preparation and making; the product is a useful result. Tools alone do not transfer every making skill.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Material, technique and product are different</text><rect x="35" y="130" width="290" height="340" rx="18" fill="#e4e8dc"/><text x="50" y="190" font-size="25">MATERIAL</text><text x="50" y="260" font-size="21">Properties and choice</text><text x="50" y="315" font-size="21">Suitable plant material</text><rect x="355" y="130" width="290" height="340" rx="18" fill="#dbecef"/><text x="370" y="190" font-size="25">TECHNIQUE</text><text x="370" y="260" font-size="21">Preparation and skill</text><text x="370" y="315" font-size="21">Learned making methods</text><rect x="675" y="130" width="290" height="340" rx="18" fill="#e4e8dc"/><text x="690" y="190" font-size="25">PRODUCT</text><text x="690" y="260" font-size="21">A useful container</text><text x="690" y="315" font-size="21">Purpose and context</text><text x="45" y="555" font-size="21">Teaching model: not a sacred pattern, an original object or an invention record.</text></g></svg>