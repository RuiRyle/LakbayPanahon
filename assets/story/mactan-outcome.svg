<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Before, result and afterward</title><desc id="desc">Put causes and outcomes in order without treating them as the same thing.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Before, result and afterward</text><text x="34" y="101" font-size="17" fill="#e0eee8">Put causes and outcomes in order without treating them as the same thing.</text><rect x="34" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="190" fill="#76451f" font-size="20" font-weight="bold">Before</text><text x="54" y="230" font-size="17" fill="#243b3b">Demands about authority met</text><text x="54" y="257" font-size="17" fill="#243b3b">refusal. Magellan attempted</text><text x="54" y="284" font-size="17" fill="#243b3b">to impose them by force.</text><rect x="349" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="190" fill="#76451f" font-size="20" font-weight="bold">27 April 1521</text><text x="369" y="230" font-size="17" fill="#243b3b">Mactan's defenders won.</text><text x="369" y="257" font-size="17" fill="#243b3b">Magellan died in the battle.</text><text x="369" y="284" font-size="17" fill="#243b3b">Collective action mattered.</text><rect x="664" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="190" fill="#76451f" font-size="20" font-weight="bold">Afterward</text><text x="684" y="230" font-size="17" fill="#243b3b">Survivors continued the</text><text x="684" y="257" font-size="17" fill="#243b3b">voyage. The battle did not</text><text x="684" y="284" font-size="17" fill="#243b3b">end all later expeditions.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. No exact scale, portraits or original dialogue.</text></g></svg>