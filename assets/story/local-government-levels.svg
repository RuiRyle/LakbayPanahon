<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Different levels, historical context</title><desc id="desc">Central: A central office is different from a provincial or town role.. Provincial: Titles included alcalde mayor and corregidor. Check jurisdiction and period.. Town and community: An order still needs evidence of implementation and local responses.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Different levels, historical context</text><text x="34" y="103" font-size="17" fill="#e0eee8">A teaching comparison, not one unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Central</text><text x="54" y="235" font-size="17" fill="#243b3b">A central office is different</text><text x="54" y="262" font-size="17" fill="#243b3b">from a provincial or town</text><text x="54" y="289" font-size="17" fill="#243b3b">role.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Provincial</text><text x="369" y="235" font-size="17" fill="#243b3b">Titles included alcalde mayor</text><text x="369" y="262" font-size="17" fill="#243b3b">and corregidor. Check</text><text x="369" y="289" font-size="17" fill="#243b3b">jurisdiction and period.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Town and community</text><text x="684" y="235" font-size="17" fill="#243b3b">An order still needs evidence</text><text x="684" y="262" font-size="17" fill="#243b3b">of implementation and local</text><text x="684" y="289" font-size="17" fill="#243b3b">responses.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram, not an original order, election record or historical quotation.</text></g></svg>