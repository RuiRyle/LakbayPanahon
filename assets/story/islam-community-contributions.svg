<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Several contributions, connected over time</title><desc>Teaching case with four connected contributions: merchants create contact, teachers share teachings, families pass knowledge and local leaders build relationships. People can have more than one role, and these cards do not describe identical histories everywhere.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Several contributions, connected over time</text><rect x="35" y="105" width="445" height="165" rx="18" fill="#e4e8dc"/><text x="60" y="160" font-size="26">MERCHANTS</text><text x="60" y="215" font-size="23">Create chances to meet</text><rect x="520" y="105" width="445" height="165" rx="18" fill="#dbecef"/><text x="545" y="160" font-size="26">TEACHERS</text><text x="545" y="215" font-size="23">Share religious teachings</text><rect x="35" y="315" width="445" height="165" rx="18" fill="#e4e8dc"/><text x="60" y="370" font-size="26">FAMILIES</text><text x="60" y="425" font-size="23">Pass knowledge to children</text><rect x="520" y="315" width="445" height="165" rx="18" fill="#dbecef"/><text x="545" y="370" font-size="26">LOCAL LEADERS</text><text x="545" y="425" font-size="23">Build community relationships</text><text x="60" y="555" font-size="23">The cards explain contributions, not four fixed kinds of people.</text><text x="35" y="615" font-size="20">Teaching model: contributions and timing differed across communities.</text></g></svg>