<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">More than one institution</title><desc id="desc">Governor-general: A leading colonial official with broad responsibilities. Not one person doing every task.. Real Audiencia: A court with other governing roles. The governor-general could preside over it.. Check the arrangement: Historical responsibilities overlapped and changed. A court does not prove universal fairness.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">More than one institution</text><text x="34" y="103" font-size="17" fill="#e0eee8">Simplified teaching guide, not an unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Governor-general</text><text x="54" y="235" font-size="17" fill="#243b3b">A leading colonial official</text><text x="54" y="262" font-size="17" fill="#243b3b">with broad responsibilities.</text><text x="54" y="289" font-size="17" fill="#243b3b">Not one person doing every</text><text x="54" y="316" font-size="17" fill="#243b3b">task.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Real Audiencia</text><text x="369" y="235" font-size="17" fill="#243b3b">A court with other governing</text><text x="369" y="262" font-size="17" fill="#243b3b">roles. The governor-general</text><text x="369" y="289" font-size="17" fill="#243b3b">could preside over it.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Check the arrangement</text><text x="684" y="235" font-size="17" fill="#243b3b">Historical responsibilities</text><text x="684" y="262" font-size="17" fill="#243b3b">overlapped and changed. A</text><text x="684" y="289" font-size="17" fill="#243b3b">court does not prove</text><text x="684" y="316" font-size="17" fill="#243b3b">universal fairness.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram. Not a complete organization chart or original historical order.</text></g></svg>