<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Gabriela Continued the Leadership</title><desc id="desc">Modern teaching cards: Action: Gabriela continued the Ilocos uprising after Diego.. Contribution: Leadership could continue through a change.. Source: A later marker is not a complete participant record.</desc><rect width="760" height="610" rx="26" fill="#163e38"/><text x="42" y="54" fill="#ebcc83" font-family="sans-serif" font-size="16">HISTORY EVIDENCE JOURNAL</text><text x="42" y="103" fill="#fff5da" font-family="sans-serif" font-size="25">Gabriela Continued the Leadership</text><rect x="42" y="145" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="175" fill="#61431e" font-family="sans-serif" font-size="20">Action</text><text x="65" y="202" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Gabriela continued the Ilocos uprising after Diego.</tspan></text><rect x="42" y="275" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="305" fill="#61431e" font-family="sans-serif" font-size="20">Contribution</text><text x="65" y="332" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Leadership could continue through a change.</tspan></text><rect x="42" y="405" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="435" fill="#61431e" font-family="sans-serif" font-size="20">Source</text><text x="65" y="462" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">A later marker is not a complete participant record.</tspan></text><text x="42" y="581" fill="#fff5da" font-family="sans-serif" font-size="14">Modern learning diagram - not an original historical source</text></svg>