<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Bandala: Compulsory Produce Delivery</title><desc id="d">The product: Bandala required agricultural produce for the colonial government.. Choice matters: A compulsory sale is not the same as a freely chosen market sale.. Compare demands: Polo concerned labor; bandala concerned produce delivery.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Bandala: Compulsory Produce Delivery</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. The product</text><text x="22" y="59" font-size="16" fill="#383d38">Bandala required agricultural produce for the colonial</text><text x="22" y="80" font-size="16" fill="#383d38">government.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Choice matters</text><text x="22" y="59" font-size="16" fill="#383d38">A compulsory sale is not the same as a freely chosen market</text><text x="22" y="80" font-size="16" fill="#383d38">sale.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Compare demands</text><text x="22" y="59" font-size="16" fill="#383d38">Polo concerned labor; bandala concerned produce delivery.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Separate the demand, action and outcome.</text></g></svg>