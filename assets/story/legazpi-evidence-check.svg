<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Read the encounter from more than one side</title><desc id="desc">A recorded action does not reveal everyone's private thoughts. Name the action: The Cebu account includes force and opposition as well as a recorded agreement.. Name participants: Ask which leaders or groups took part. Do not treat one leader as every person.. Check the limit: An agreement or a settlement does not establish consent or control everywhere.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Read the encounter from more than one side</text><text x="34" y="102" font-size="17" fill="#e0eee8">A recorded action does not reveal everyone's private thoughts.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">Name the action</text><text x="54" y="234" font-size="17" fill="#243b3b">The Cebu account includes</text><text x="54" y="261" font-size="17" fill="#243b3b">force and opposition as well</text><text x="54" y="288" font-size="17" fill="#243b3b">as a recorded agreement.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Name participants</text><text x="369" y="234" font-size="17" fill="#243b3b">Ask which leaders or groups</text><text x="369" y="261" font-size="17" fill="#243b3b">took part. Do not treat one</text><text x="369" y="288" font-size="17" fill="#243b3b">leader as every person.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Check the limit</text><text x="684" y="234" font-size="17" fill="#243b3b">An agreement or a settlement</text><text x="684" y="261" font-size="17" fill="#243b3b">does not establish consent or</text><text x="684" y="288" font-size="17" fill="#243b3b">control everywhere.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model, not an original image, precise map or historical quotation.</text></g></svg>