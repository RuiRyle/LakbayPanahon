<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Religious Work and Colonial Power</title><desc id="desc">An overlapping context: Missionary work and colonial government could be connected without every participant having identical aims.. Power matters: Study evidence of pressure, alliances and local decisions alongside religious events.. Avoid invented motives: An official's aim is not every family's private reason for participating.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Religious Work and Colonial Power</text><text x="34" y="103" font-size="17" fill="#e0eee8">Study historical evidence respectfully. No religious practice is required.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">An overlapping context</text><text x="54" y="249" font-size="16" fill="#243b3b">Missionary work and colonial</text><text x="54" y="273" font-size="16" fill="#243b3b">government could be connected</text><text x="54" y="297" font-size="16" fill="#243b3b">without every participant</text><text x="54" y="321" font-size="16" fill="#243b3b">having identical aims.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Power matters</text><text x="369" y="249" font-size="16" fill="#243b3b">Study evidence of pressure,</text><text x="369" y="273" font-size="16" fill="#243b3b">alliances and local decisions</text><text x="369" y="297" font-size="16" fill="#243b3b">alongside religious events.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Avoid invented motives</text><text x="684" y="249" font-size="16" fill="#243b3b">An official's aim is not</text><text x="684" y="273" font-size="16" fill="#243b3b">every family's private reason</text><text x="684" y="297" font-size="16" fill="#243b3b">for participating.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original page, ceremony image or historical quotation.</text></g></svg>