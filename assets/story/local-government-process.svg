<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A request is not its result</title><desc id="desc">Record the action: Who issued a demand or made a request? In which place and period?. Check the response: Was a decision given? Was it implemented? Do not invent a missing reply.. Ask whose voice: An official or petition writer is not automatically every resident.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">A request is not its result</text><text x="34" y="103" font-size="17" fill="#e0eee8">A teaching comparison, not one unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Record the action</text><text x="54" y="235" font-size="17" fill="#243b3b">Who issued a demand or made a</text><text x="54" y="262" font-size="17" fill="#243b3b">request? In which place and</text><text x="54" y="289" font-size="17" fill="#243b3b">period?</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Check the response</text><text x="369" y="235" font-size="17" fill="#243b3b">Was a decision given? Was it</text><text x="369" y="262" font-size="17" fill="#243b3b">implemented? Do not invent a</text><text x="369" y="289" font-size="17" fill="#243b3b">missing reply.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Ask whose voice</text><text x="684" y="235" font-size="17" fill="#243b3b">An official or petition</text><text x="684" y="262" font-size="17" fill="#243b3b">writer is not automatically</text><text x="684" y="289" font-size="17" fill="#243b3b">every resident.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram, not an original order, election record or historical quotation.</text></g></svg>