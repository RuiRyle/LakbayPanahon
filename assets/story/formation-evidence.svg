<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Match the source to the question</title><desc>Card A describes physical observations for a geology question. Card B describes an attributed community account for a question about story meaning. No authentic traditional story is reproduced.</desc><rect width="1000" height="620" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="29">Match the source to the question</text><rect x="35" y="110" width="445" height="390" rx="18" fill="#dbecef"/><rect x="520" y="110" width="445" height="390" rx="18" fill="#e4e8dc"/><text x="60" y="165" font-size="27">A. Physical evidence</text><text x="60" y="235" font-size="23">Rock samples</text><text x="60" y="280" font-size="23">Measured movement</text><text x="60" y="325" font-size="23">Land and water observations</text><text x="60" y="420" font-size="21">Question: how does land change?</text><text x="545" y="165" font-size="27">B. Community account</text><text x="545" y="235" font-size="23">Named source and context</text><text x="545" y="280" font-size="23">Meaning and values</text><text x="545" y="325" font-size="23">Permission to share</text><text x="545" y="420" font-size="21">Question: what does a story mean?</text><text x="35" y="575" font-size="19">Simplified classroom model, not to scale. Not a map or eruption forecast.</text></g></svg>