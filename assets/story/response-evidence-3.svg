<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Resistance Was Broader Than Fighting</title><desc id="d">Opposition: Resistance concerns opposing a demand or imposed authority.. Different forms: Not every form of resistance is armed fighting.. Evidence and harm: Identify the recorded action and its context without rewarding or erasing harm.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Resistance Was Broader Than Fighting</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Opposition</text><text x="22" y="59" font-size="16" fill="#383d38">Resistance concerns opposing a demand or imposed authority.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Different forms</text><text x="22" y="59" font-size="16" fill="#383d38">Not every form of resistance is armed fighting.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Evidence and harm</text><text x="22" y="59" font-size="16" fill="#383d38">Identify the recorded action and its context without rewarding</text><text x="22" y="80" font-size="16" fill="#383d38">or erasing harm.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check the situation, action, conditions and outcome.</text></g></svg>