<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Keep Makers in the Story</title><desc id="d">People and work: Objects and buildings depend on materials, skills and work.. Different roles: A patron who requests work is not necessarily the person who makes it.. Missing names: A record may leave some contributors unnamed.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Keep Makers in the Story</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. People and work</text><text x="22" y="59" font-size="16" fill="#383d38">Objects and buildings depend on materials, skills and work.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Different roles</text><text x="22" y="59" font-size="16" fill="#383d38">A patron who requests work is not necessarily the person who</text><text x="22" y="80" font-size="16" fill="#383d38">makes it.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Missing names</text><text x="22" y="59" font-size="16" fill="#383d38">A record may leave some contributors unnamed.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check makers, dates, use and purpose.</text></g></svg>