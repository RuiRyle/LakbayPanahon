<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Polo: Required Work</title><desc id="d">The demand: Polo concerned required labor service, not simply a freely chosen gift.. The setting: Ask who was called, where and under which dated rules.. Action needs evidence: An order alone does not prove attendance, agreement or completed work.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Polo: Required Work</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. The demand</text><text x="22" y="59" font-size="16" fill="#383d38">Polo concerned required labor service, not simply a freely</text><text x="22" y="80" font-size="16" fill="#383d38">chosen gift.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. The setting</text><text x="22" y="59" font-size="16" fill="#383d38">Ask who was called, where and under which dated rules.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Action needs evidence</text><text x="22" y="59" font-size="16" fill="#383d38">An order alone does not prove attendance, agreement or</text><text x="22" y="80" font-size="16" fill="#383d38">completed work.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Separate the demand, action and outcome.</text></g></svg>