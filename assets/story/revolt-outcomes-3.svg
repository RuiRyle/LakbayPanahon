<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Ask About People Afterward</title><desc id="desc">Modern teaching cards. People: Leaders and households are different subjects.. Evidence: A biography can establish a leadership change.. Limits: Household effects need evidence about those households.</desc><rect width="760" height="610" rx="26" fill="#163e38"/><text x="42" y="54" fill="#ebcc83" font-family="sans-serif" font-size="16">HISTORY EVIDENCE JOURNAL</text><text x="42" y="103" fill="#fff5da" font-family="sans-serif" font-size="25">Ask About People Afterward</text><rect x="42" y="145" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="175" fill="#61431e" font-family="sans-serif" font-size="20">People</text><text x="65" y="202" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Leaders and households are different subjects.</tspan></text><rect x="42" y="275" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="305" fill="#61431e" font-family="sans-serif" font-size="20">Evidence</text><text x="65" y="332" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">A biography can establish a leadership change.</tspan></text><rect x="42" y="405" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="435" fill="#61431e" font-family="sans-serif" font-size="20">Limits</text><text x="65" y="462" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Household effects need evidence about those households.</tspan></text><text x="42" y="581" fill="#fff5da" font-family="sans-serif" font-size="14">Modern learning diagram - not an original historical source</text></svg>