<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Separate three evidence questions</title><desc id="desc">Aim: what was wanted?: Trade access, influence or religious aims may appear in a sponsor's plans.. Method: what was done?: Actions and institutions could be used to pursue an aim. Check context and pressure.. Effect: what followed?: Investigate consequences for people, rather than assume intentions were achieved.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Separate three evidence questions</text><text x="34" y="103" font-size="17" fill="#e0eee8">Teaching guide: distinguish the claim, its evidence and its limits.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Aim: what was wanted?</text><text x="54" y="235" font-size="17" fill="#243b3b">Trade access, influence or</text><text x="54" y="262" font-size="17" fill="#243b3b">religious aims may appear in</text><text x="54" y="289" font-size="17" fill="#243b3b">a sponsor's plans.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Method: what was done?</text><text x="369" y="235" font-size="17" fill="#243b3b">Actions and institutions</text><text x="369" y="262" font-size="17" fill="#243b3b">could be used to pursue an</text><text x="369" y="289" font-size="17" fill="#243b3b">aim. Check context and</text><text x="369" y="316" font-size="17" fill="#243b3b">pressure.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Effect: what followed?</text><text x="684" y="235" font-size="17" fill="#243b3b">Investigate consequences for</text><text x="684" y="262" font-size="17" fill="#243b3b">people, rather than assume</text><text x="684" y="289" font-size="17" fill="#243b3b">intentions were achieved.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram, not an original historical document or quotation.</text></g></svg>