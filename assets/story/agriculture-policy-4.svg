<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Compare Income, Costs and Choices</title><desc id="d">Two viewpoints: Government revenue and a growers household outcome are different questions.. Subtract listed costs: Eight received minus five listed costs leaves three in the fictional model.. Missing information: Check whether an account leaves out costs, work or payment delays.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Compare Income, Costs and Choices</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Two viewpoints</text><text x="22" y="59" font-size="16" fill="#383d38">Government revenue and a growers household outcome are</text><text x="22" y="80" font-size="16" fill="#383d38">different questions.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Subtract listed costs</text><text x="22" y="59" font-size="16" fill="#383d38">Eight received minus five listed costs leaves three in the</text><text x="22" y="80" font-size="16" fill="#383d38">fictional model.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Missing information</text><text x="22" y="59" font-size="16" fill="#383d38">Check whether an account leaves out costs, work or payment</text><text x="22" y="80" font-size="16" fill="#383d38">delays.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check uses, rules, costs and choices.</text></g></svg>