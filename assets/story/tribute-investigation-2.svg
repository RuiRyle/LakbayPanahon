<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Payments Could Involve Goods</title><desc id="d">More than coins: Early accounts describe goods, including cloth and rice, in some tribute collections.. Work behind goods: Products represent work and materials, not objects that appeared without effort.. Local detail: A named item does not establish one amount or form for every community.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><path d="M0 50H760M0 570H760" stroke="#bd9349" stroke-width="3"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Payments Could Involve Goods</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. More than coins</text><text x="22" y="59" font-size="16" fill="#383d38">Early accounts describe goods, including cloth and rice, in</text><text x="22" y="80" font-size="16" fill="#383d38">some tribute collections.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Work behind goods</text><text x="22" y="59" font-size="16" fill="#383d38">Products represent work and materials, not objects that</text><text x="22" y="80" font-size="16" fill="#383d38">appeared without effort.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Local detail</text><text x="22" y="59" font-size="16" fill="#383d38">A named item does not establish one amount or form for every</text><text x="22" y="80" font-size="16" fill="#383d38">community.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check the dema