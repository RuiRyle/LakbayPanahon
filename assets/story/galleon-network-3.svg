<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Look Beyond the Cargo</title><desc id="d">Making: Goods depended on materials, skills and work.. Moving: Crews and other workers helped prepare and move supplies and cargo.. Missing voices: A merchant account may not name everyone who contributed.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Look Beyond the Cargo</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Making</text><text x="22" y="59" font-size="16" fill="#383d38">Goods depended on materials, skills and work.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Moving</text><text x="22" y="59" font-size="16" fill="#383d38">Crews and other workers helped prepare and move supplies and</text><text x="22" y="80" font-size="16" fill="#383d38">cargo.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Missing voices</text><text x="22" y="59" font-size="16" fill="#383d38">A merchant account may not name everyone who contributed.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Follow goods, people and evidence.</text></g></svg>