<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">What does a name establish?</title><desc id="desc">A recorded name and local consent are different claims. The naming link: Filipinas is associated with Villalobos's expedition and Prince Felipe.. The existing places: Communities, histories and local names already existed. A new name did not create them.. The limit: A naming record does not establish that all communities accepted foreign rule.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">What does a name establish?</text><text x="34" y="102" font-size="17" fill="#e0eee8">A recorded name and local consent are different claims.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">The naming link</text><text x="54" y="234" font-size="17" fill="#243b3b">Filipinas is associated with</text><text x="54" y="261" font-size="17" fill="#243b3b">Villalobos's expedition and</text><text x="54" y="288" font-size="17" fill="#243b3b">Prince Felipe.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">The existing places</text><text x="369" y="234" font-size="17" fill="#243b3b">Communities, histories and</text><text x="369" y="261" font-size="17" fill="#243b3b">local names already existed.</text><text x="369" y="288" font-size="17" fill="#243b3b">A new name did not create</text><text x="369" y="315" font-size="17" fill="#243b3b">them.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">The limit</text><text x="684" y="234" font-size="17" fill="#243b3b">A naming record does not</text><text x="684" y="261" font-size="17" fill="#243b3b">establish that all</text><text x="684" y="288" font-size="17" fill="#243b3b">communities accepted foreign</text><text x="684" y="315" font-size="17" fill="#243b3b">rule.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not a geographic map or original historical quotation.</text></g></svg>