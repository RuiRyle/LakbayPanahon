<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Communication and Local Languages</title><desc id="desc">A communication effort: Using local languages could help missionaries communicate teachings, but did not guarantee identical understanding.. A surviving object: The 1593 Doctrina Christiana is evidence of religious teaching material and printing, not every person's reading or belief.. Check reception: Production, circulation, reading and acceptance are different claims that need appropriate evidence.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Communication and Local Languages</text><text x="34" y="103" font-size="17" fill="#e0eee8">Study historical evidence respectfully. No religious practice is required.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A communication effort</text><text x="54" y="249" font-size="16" fill="#243b3b">Using local languages could</text><text x="54" y="273" font-size="16" fill="#243b3b">help missionaries communicate</text><text x="54" y="297" font-size="16" fill="#243b3b">teachings, but did not</text><text x="54" y="321" font-size="16" fill="#243b3b">guarantee identical</text><text x="54" y="345" font-size="16" fill="#243b3b">understanding.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A surviving object</text><text x="369" y="249" font-size="16" fill="#243b3b">The 1593 Doctrina Christiana</text><text x="369" y="273" font-size="16" fill="#243b3b">is evidence of religious</text><text x="369" y="297" font-size="16" fill="#243b3b">teaching material and</text><text x="369" y="321" font-size="16" fill="#243b3b">printing, not every person's</text><text x="369" y="345" font-size="16" fill="#243b3b">reading or belief.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Check reception</text><text x="684" y="249" font-size="16" fill="#243b3b">Production, circulation,</text><text x="684" y="273" font-size="16" fill="#243b3b">reading and acceptance are</text><text x="684" y="297" font-size="16" fill="#243b3b">different claims that need</text><text x="684" y="321" font-size="16" fill="#243b3b">appropriate evidence.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original page, ceremony image or historical quotation.</text></g></svg>