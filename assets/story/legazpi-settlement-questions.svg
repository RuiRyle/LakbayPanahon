<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A base in an existing community</title><desc id="desc">A conceptual existing community surrounds a separately marked Spanish base. Maintaining that base is not proof of universal control. Investigate supplies, local responses, effective authority and limits.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">A base in an existing community</text><text x="34" y="102" font-size="17" fill="#e0eee8">Conceptual comparison, not a reconstructed plan of Cebu in 1565.</text>
<rect x="34" y="145" width="580" height="290" rx="18" fill="#e2ebd7"/><rect x="645" y="145" width="320" height="290" rx="18" fill="#fff8e7"/>
<g fill="#244b40" font-size="19" font-weight="bold"><text x="58" y="183">Existing Cebu community</text><text x="666" y="183">Questions to investigate</text></g>
<g fill="#ead3a3" stroke="#78613e" stroke-width="3"><path d="M70 265h85v65H70Z M65 265l48-38 48 38Z"/><path d="M190 245h85v65h-85Z M185 245l48-38 48 38Z"/><path d="M86 370h85v40H86Z M81 370l48-28 48 28Z"/></g>
<rect x="340" y="233" width="235" height="157" rx="8" fill="#fff7e7" stroke="#926f40" stroke-width="3" stroke-dasharray="7 5"/>
<g fill="#243b3b" font-size="17"><text x="360" y="267">A maintained</text><text x="360" y="293">Spanish base</text><text x="360" y="336">Evidence of presence,</text><text x="360" y="362">not universal control</text><text x="666" y="231">How was it supplied?</text><text x="666" y="277">How did people respond?</text><text x="666" y="323">Where did authority work?</text><text x="666" y="369">What limits remained?</text></g>
<text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model, not an original image, precise map or historical quotation.</text></g></svg>