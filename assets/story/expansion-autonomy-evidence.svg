<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Keep the examples distinct</title><desc id="desc">Introductory comparisons, not complete histories of all communities. Ifugao example: National Museum research material describes resistance to Spanish conquest.. Sulu example: NCCA discusses diplomacy and conflict, including a later treaty in 1726.. Compare carefully: Different places and periods can test a uniform-control claim without becoming one story.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Keep the examples distinct</text><text x="34" y="102" font-size="17" fill="#e0eee8">Introductory comparisons, not complete histories of all communities.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">Ifugao example</text><text x="54" y="234" font-size="17" fill="#243b3b">National Museum research</text><text x="54" y="261" font-size="17" fill="#243b3b">material describes resistance</text><text x="54" y="288" font-size="17" fill="#243b3b">to Spanish conquest.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Sulu example</text><text x="369" y="234" font-size="17" fill="#243b3b">NCCA discusses diplomacy and</text><text x="369" y="261" font-size="17" fill="#243b3b">conflict, including a later</text><text x="369" y="288" font-size="17" fill="#243b3b">treaty in 1726.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Compare carefully</text><text x="684" y="234" font-size="17" fill="#243b3b">Different places and periods</text><text x="684" y="261" font-size="17" fill="#243b3b">can test a uniform-control</text><text x="684" y="288" font-size="17" fill="#243b3b">claim without becoming one</text><text x="684" y="315" font-size="17" fill="#243b3b">story.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not an original source, precise boundary map or portrait.</text></g></svg>