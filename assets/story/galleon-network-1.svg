<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="t d"><title id="t">Manila and Acapulco: a Pacific trade connection</title><desc id="d">Schematic only, not a map or exact sailing track. Asian goods move from Manila toward Acapulco; silver moves from the Americas toward Manila. The connection is commonly dated 1565 to 1815, not the whole history of Philippine trade.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245c58"/></marker></defs><rect width="920" height="620" rx="24" fill="#e2ece8"/><g font-family="sans-serif" fill="#244c48"><text x="40" y="55" font-size="28">Follow the Pacific Connection</text><text x="40" y="86" font-size="17">1565-1815 / Modern teaching schematic</text><rect x="40" y="125" width="200" height="180" rx="20" fill="#fff8e8" stroke="#b28c47"/><text x="140" y="190" text-anchor="middle" font-size="27">Manila</text><text x="140" y="222" text-anchor="middle" font-size="18">Philippines</text><rect x="680" y="125" width="200" height="180" rx="20" fill="#fff8e8" stroke="#b28c47"/><text x="780" y="190" text-anchor="middle" font-size="27">Acapulco</text><text x="780" y="222" text-anchor="middle" font-size="18">New Spain</text><text x="780" y="249" text-anchor="middle" font-size="16">Now Mexico</text><text x="460" y="145" text-anchor="middle" font-size="23">Pacific Ocean</text><path d="M260 195H655" stroke="#245c58" stroke-width="4" marker-end="url(#arrow)"/><text x="460" y="181" text-anchor="middle" font-size="17">Asian goods toward the Americas</text><path d="M660 259H265" stroke="#245c58" stroke-width="4" marker-end="url(#arrow)"/><text x="460" y="288" text-anchor="middle" font-size="17">Silver toward Manila</text><rect x="40" y="340" width="840" height="233" rx="20" fill="#fff8e8"/><text x="65" y="381" font-size="22">Read the connection carefully</text><text x="65" y="423" font-size="19">1. The arrows show links and directions of exchange.</text><text x="65" y="464" font-size="19">2. They are not coastlines, distances or exact sailing tracks.</text><text x="65" y="505" font-size="19">3. These dates do not mark all Philippine trade beginning or ending.</text><text x="65" y="546" font-size="17">Check dated records for a particular voyage.</text></g></svg>