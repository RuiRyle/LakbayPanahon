<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A duty is not proof of its performance</title><desc id="desc">Administration: Central officials coordinated decisions. Many participants were needed for action.. Defense: The governor-general held military as well as civil responsibilities.. Evaluate with evidence: Ask what was done, how it was carried out and what consequences followed.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">A duty is not proof of its performance</text><text x="34" y="103" font-size="17" fill="#e0eee8">Simplified teaching guide, not an unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Administration</text><text x="54" y="235" font-size="17" fill="#243b3b">Central officials coordinated</text><text x="54" y="262" font-size="17" fill="#243b3b">decisions. Many participants</text><text x="54" y="289" font-size="17" fill="#243b3b">were needed for action.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Defense</text><text x="369" y="235" font-size="17" fill="#243b3b">The governor-general held</text><text x="369" y="262" font-size="17" fill="#243b3b">military as well as civil</text><text x="369" y="289" font-size="17" fill="#243b3b">responsibilities.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Evaluate with evidence</text><text x="684" y="235" font-size="17" fill="#243b3b">Ask what was done, how it was</text><text x="684" y="262" font-size="17" fill="#243b3b">carried out and what</text><text x="684" y="289" font-size="17" fill="#243b3b">consequences followed.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram. Not a complete organization chart or original historical order.</text></g></svg>