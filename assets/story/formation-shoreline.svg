<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Compare water coverage, not new rock</title><desc>Both panels have exactly the same land shape. Higher water covers a shallow ledge and deep channel. Lower water exposes the ledge while the deep channel still holds water.</desc><rect width="1000" height="620" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="29">Compare water coverage, not new rock</text><g transform="translate(30,100)"><rect width="460" height="430" rx="15" fill="#e4edf0"/><text x="15" y="35" font-size="26">A. Higher water</text><path d="M20 140H60L120 240H240L300 340H330L390 140H440V400H20Z" fill="#b79a70" stroke="#735936" stroke-width="3"/><path d="M96 200H372L330 340H300L240 240H120Z" fill="#7dbacb"/><path d="M75 200H420" stroke="#286b89" stroke-width="3" stroke-dasharray="7 5"/><text x="120" y="220" font-size="20">Shallow ledge</text><text x="250" y="375" font-size="20">Deep channel</text><text x="20" y="420" font-size="19">Same land shape in both panels</text></g><g transform="translate(520,100)"><rect width="460" height="430" rx="15" fill="#e4edf0"/><text x="15" y="35" font-size="26">B. Lower water</text><path d="M20 140H60L120 240H240L300 340H330L390 140H440V400H20Z" fill="#b79a70" stroke="#735936" stroke-width="3"/><path d="M264 280H348L330 340H300Z" fill="#7dbacb"/><path d="M75 280H420" stroke="#286b89" stroke-width="3" stroke-dasharray="7 5"/><text x="120" y="220" font-size="20">Shallow ledge</text><text x="250" y="375" font-size="20">Deep channel</text><text x="20" y="420" font-size="19">Same land shape in both panels</text></g><text x="35" y="575" font-size="19">Simplified classroom model, not to scale. Not a map or eruption forecast.</text></g></svg>