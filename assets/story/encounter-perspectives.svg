<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Build a careful encounter report</title><desc id="desc">Separate the event, your explanation and what remains unknown. Name the event: Identify a place, action and source. Was the record made then or much later?. Explain the evidence: Link your claim to the source. Ask whose viewpoint the account records.. Check the limit: A single account does not reveal every person's beliefs, motives or decisions.</desc><rect width="1000" height="490" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Build a careful encounter report</text><text x="34" y="104" font-size="18" fill="#e0eee8">Separate the event, your explanation and what remains unknown.</text><rect x="34" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="62" cy="184" r="13" fill="#315c56"/><text x="62" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">1</text><text x="54" y="225" fill="#76451f" font-size="19" font-weight="bold">Name the event</text><text x="54" y="259" fill="#243b3b" font-size="17">Identify a place, action and</text><text x="54" y="285" fill="#243b3b" font-size="17">source. Was the record made</text><text x="54" y="311" fill="#243b3b" font-size="17">then or much later?</text><path d="M331 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="349" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="377" cy="184" r="13" fill="#315c56"/><text x="377" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">2</text><text x="369" y="225" fill="#76451f" font-size="19" font-weight="bold">Explain the evidence</text><text x="369" y="259" fill="#243b3b" font-size="17">Link your claim to the</text><text x="369" y="285" fill="#243b3b" font-size="17">source. Ask whose viewpoint</text><text x="369" y="311" fill="#243b3b" font-size="17">the account records.</text><path d="M646 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="664" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="692" cy="184" r="13" fill="#315c56"/><text x="692" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">3</text><text x="684" y="225" fill="#76451f" font-size="19" font-weight="bold">Check the limit</text><text x="684" y="259" fill="#243b3b" font-size="17">A single account does not</text><text x="684" y="285" fill="#243b3b" font-size="17">reveal every person's</text><text x="684" y="311" fill="#243b3b" font-size="17">beliefs, motives or</text><text x="684" y="337" fill="#243b3b" font-size="17">decisions.</text><text x="34" y="461" font-size="16" fill="#e0eee8">Modern learning diagram. Not an original image or quotation from 1521.</text></g></svg>