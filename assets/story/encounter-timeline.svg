<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Follow the encounter trail</title><desc id="desc">Selected events in order. Not a geographic map; many stops are omitted. Homonhon: 17 March 1521: landfall. A landing is different from seeing land from a ship.. Limasawa: Later in March: meetings. Recorded Easter Sunday Mass on 31 March 1521.. Cebu: 7 April 1521: arrival at an existing trading place led by Rajah Humabon.</desc><rect width="1000" height="490" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Follow the encounter trail</text><text x="34" y="104" font-size="18" fill="#e0eee8">Selected events in order. Not a geographic map; many stops are omitted.</text><rect x="34" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="62" cy="184" r="13" fill="#315c56"/><text x="62" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">1</text><text x="54" y="225" fill="#76451f" font-size="19" font-weight="bold">Homonhon</text><text x="54" y="259" fill="#243b3b" font-size="17">17 March 1521: landfall. A</text><text x="54" y="285" fill="#243b3b" font-size="17">landing is different from</text><text x="54" y="311" fill="#243b3b" font-size="17">seeing land from a ship.</text><path d="M331 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="349" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="377" cy="184" r="13" fill="#315c56"/><text x="377" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">2</text><text x="369" y="225" fill="#76451f" font-size="19" font-weight="bold">Limasawa</text><text x="369" y="259" fill="#243b3b" font-size="17">Later in March: meetings.</text><text x="369" y="285" fill="#243b3b" font-size="17">Recorded Easter Sunday Mass</text><text x="369" y="311" fill="#243b3b" font-size="17">on 31 March 1521.</text><path d="M646 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="664" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="692" cy="184" r="13" fill="#315c56"/><text x="692" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">3</text><text x="684" y="225" fill="#76451f" font-size="19" font-weight="bold">Cebu</text><text x="684" y="259" fill="#243b3b" font-size="17">7 April 1521: arrival at an</text><text x="684" y="285" fill="#243b3b" font-size="17">existing trading place led by</text><text x="684" y="311" fill="#243b3b" font-size="17">Rajah Humabon.</text><text x="34" y="461" font-size="16" fill="#e0eee8">Modern learning diagram. Not an original image or quotation from 1521.</text></g></svg>