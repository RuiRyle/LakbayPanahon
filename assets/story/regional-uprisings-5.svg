<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Compare Similarities Without Erasing Differences</title><desc id="d">Shared question: Ask the same clear questions of each named case.. Differences: Similar opposition does not establish identical aims, people or coordination.. Source perspective: Entries, markers and art accounts support different claims and have their own limits.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Compare Similarities Without Erasing Differences</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Shared question</text><text x="22" y="59" font-size="16" fill="#383d38">Ask the same clear questions of each named case.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Differences</text><text x="22" y="59" font-size="16" fill="#383d38">Similar opposition does not establish identical aims, people</text><text x="22" y="80" font-size="16" fill="#383d38">or coordination.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Source perspective</text><text x="22" y="59" font-size="16" fill="#383d38">Entries, markers and art accounts support different claims and</text><text x="22" y="80" font-size="16" fill="#383d38">have their own limits.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare place, period, concern, action and source.</text></g></svg>