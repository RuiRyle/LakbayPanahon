<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="t d"><title id="t">Living Traditions Need Dated Evidence</title><desc id="d">Living knowledge: People pass on knowledge and can also make changes.. Dates matter: Ask when an object was made or collected.. Respect difference: Different groups should not be treated as one identical culture.</desc><rect width="760" height="590" rx="24" fill="#eee2c7"/><path d="M0 50H760M0 550H760" stroke="#bd9349" stroke-width="3"/><text x="42" y="89" font-family="sans-serif" font-size="25" fill="#244c48">Living Traditions Need Dated Evidence</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g font-family="sans-serif"><g transform="translate(42 150)"><rect width="676" height="104" rx="18" fill="#fff8e8" stroke="#bd9349"/><circle cx="38" cy="38" r="20" fill="#244c48"/><text x="38" y="45" text-anchor="middle" fill="white" font-size="19">1</text><text x="74" y="35" font-size="22" fill="#244c48">Living knowledge</text><text x="74" y="63" font-size="16" fill="#383d38">People pass on knowledge and can also make changes.</text></g><g transform="translate(42 276)"><rect width="676" height="104" rx="18" fill="#fff8e8" stroke="#bd9349"/><circle cx="38" cy="38" r="20" fill="#244c48"/><text x="38" y="45" text-anchor="middle" fill="white" font-size="19">2</text><text x="74" y="35" font-size="22" fill="#244c48">Dates matter</text><text x="74" y="63" font-size="16" fill="#383d38">Ask when an object was made or collected.</text></g><g transform="translate(42 402)"><rect width="676" height="104" rx="18" fill="#fff8e8" stroke="#bd9349"/><circle cx="38" cy="38" r="20" fill="#244c48"/><text x="38" y="45" text-anchor="middle" fill="white" font-size="19">3</text><text x="74" y="35" font-size="22" fill="#244c48">Respect difference</text><text x="74" y="63" font-size="16" fill="#383d38">Different groups should not be treated as one identical</t