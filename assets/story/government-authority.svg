<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">An office in colonial government</title><desc id="desc">Spanish Crown: The monarchy and its authority. The governor-general represented colonial authority.. Office and holders: Different people could hold an office at different times.. Keep the distinction: This is not the office of a modern elected Philippine president.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">An office in colonial government</text><text x="34" y="103" font-size="17" fill="#e0eee8">Simplified teaching guide, not an unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Spanish Crown</text><text x="54" y="235" font-size="17" fill="#243b3b">The monarchy and its</text><text x="54" y="262" font-size="17" fill="#243b3b">authority. The</text><text x="54" y="289" font-size="17" fill="#243b3b">governor-general represented</text><text x="54" y="316" font-size="17" fill="#243b3b">colonial authority.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Office and holders</text><text x="369" y="235" font-size="17" fill="#243b3b">Different people could hold</text><text x="369" y="262" font-size="17" fill="#243b3b">an office at different times.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Keep the distinction</text><text x="684" y="235" font-size="17" fill="#243b3b">This is not the office of a</text><text x="684" y="262" font-size="17" fill="#243b3b">modern elected Philippine</text><text x="684" y="289" font-size="17" fill="#243b3b">president.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram. Not a complete organization chart or original historical order.</text></g></svg>