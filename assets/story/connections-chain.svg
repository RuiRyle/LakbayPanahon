<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="title desc"><title id="title">PEOPLE MAKE THE CONNECTION</title><desc id="desc">CONNECT: Routes and ports: People and materials. ACT: Read and discuss: Compare experiences. ASK: Public concerns: Fairness and access. Connections offer opportunities; people interpret and act.</desc><rect width="1060" height="600" rx="28" fill="#f6efd9"/><path d="M24 95H1036" stroke="#c8b47e" stroke-width="2"/><text x="40" y="62" font-family="system-ui,sans-serif" fill="#355742" font-size="28" font-weight="800">PEOPLE MAKE THE CONNECTION</text><g font-family="system-ui,sans-serif"><g><rect x="38" y="170" width="296" height="280" rx="24" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="58" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="186" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">CONNECT</text><text x="186" y="320" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Routes and ports</text><text x="186" y="370" text-anchor="middle" fill="#59674f" font-size="20">People and materials</text></g><g><rect x="368" y="170" width="296" height="280" rx="24" fill="#e5efdf" stroke="#b6c6a6" stroke-width="2"/><rect x="388" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="516" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">ACT</text><text x="516" y="320" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Read and discuss</text><text x="516" y="370" text-anchor="middle" fill="#59674f" font-size="20">Compare experiences</text></g><g><rect x="698" y="170" width="296" height="280" rx="24" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="718" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="846" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">ASK</text><text x="846" y="320" text-anchor="middle" fill="#304e3c" font-size