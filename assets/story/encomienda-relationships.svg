<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Right to Collect, Not Automatic Land Ownership</title><desc id="desc">The arrangement: An encomienda involved tribute-collection rights over specified people or communities and stated obligations.. The holder: An encomendero held the grant; the title alone does not establish every action that person took.. A separate land question: Collection rights are not automatically ownership of every field. Land claims require their own evidence.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Right to Collect, Not Automatic Land Ownership</text><text x="34" y="103" font-size="17" fill="#e0eee8">Separate the arrangement, its practice and evidence about people.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">The arrangement</text><text x="54" y="249" font-size="16" fill="#243b3b">An encomienda involved</text><text x="54" y="273" font-size="16" fill="#243b3b">tribute-collection rights</text><text x="54" y="297" font-size="16" fill="#243b3b">over specified people or</text><text x="54" y="321" font-size="16" fill="#243b3b">communities and stated</text><text x="54" y="345" font-size="16" fill="#243b3b">obligations.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">The holder</text><text x="369" y="249" font-size="16" fill="#243b3b">An encomendero held the</text><text x="369" y="273" font-size="16" fill="#243b3b">grant; the title alone does</text><text x="369" y="297" font-size="16" fill="#243b3b">not establish every action</text><text x="369" y="321" font-size="16" fill="#243b3b">that person took.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">A separate land question</text><text x="684" y="249" font-size="16" fill="#243b3b">Collection rights are not</text><text x="684" y="273" font-size="16" fill="#243b3b">automatically ownership of</text><text x="684" y="297" font-size="16" fill="#243b3b">every field. Land claims</text><text x="684" y="321" font-size="16" fill="#243b3b">require their own evidence.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not a land deed, authentic receipt or universal tax schedule.</text></g></svg>