<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Choices About Producing and Selling</title><desc id="d">Policy scope: Check which crop, district and period a rule covered.. Available choices: Required delivery can restrict where a producer sells.. Separate questions: Payment does not automatically prove freely chosen participation.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Choices About Producing and Selling</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Policy scope</text><text x="22" y="59" font-size="16" fill="#383d38">Check which crop, district and period a rule covered.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Available choices</text><text x="22" y="59" font-size="16" fill="#383d38">Required delivery can restrict where a producer sells.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Separate questions</text><text x="22" y="59" font-size="16" fill="#383d38">Payment does not automatically prove freely chosen</text><text x="22" y="80" font-size="16" fill="#383d38">participation.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare resources, time, choices and responses.</text></g></svg>