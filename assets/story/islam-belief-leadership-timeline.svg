<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Religious milestones and political development</title><desc>First reference: 1380, associated in official recognition with the Sheikh Karimul Makhdum mosque site in Simunul. Later period: the 1400s, when the Sulu sultanate developed. These are different processes, not universal conversion dates; the timeline is not to scale.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Religious milestones and political development</text><rect x="35" y="110" width="445" height="375" rx="18" fill="#e4e8dc"/><rect x="520" y="110" width="445" height="375" rx="18" fill="#dbecef"/><text x="60" y="170" font-size="25">1380: remembered milestone</text><text x="60" y="240" font-size="22">Simunul mosque site</text><text x="60" y="290" font-size="22">Islamic teaching and worship</text><text x="60" y="390" font-size="22">Not a date when everyone</text><text x="60" y="430" font-size="22">adopted one belief</text><text x="545" y="170" font-size="25">1400s: Sulu sultanate</text><text x="545" y="240" font-size="22">Political leadership</text><text x="545" y="290" font-size="22">Sultan and local relationships</text><text x="545" y="390" font-size="22">Not one government for</text><text x="545" y="430" font-size="22">all Philippine islands</text><text x="60" y="555" font-size="23">Related histories, different questions. Dates shown are not to scale.</text><text x="35" y="615" font-size="20">Teaching model: contributions and timing differed across communities.</text></g></svg>