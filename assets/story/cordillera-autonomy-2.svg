<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">People Made Choices Under Pressure</title><desc id="d">Named research: Ifugao research connects resistance with local strategies and organization.. Condition and action: Terrain matters, but it does not make every decision for people.. Limit: A strategy needs evidence; it is not a universal rule for every community.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">People Made Choices Under Pressure</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Named research</text><text x="22" y="59" font-size="16" fill="#383d38">Ifugao research connects resistance with local strategies and</text><text x="22" y="80" font-size="16" fill="#383d38">organization.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Condition and action</text><text x="22" y="59" font-size="16" fill="#383d38">Terrain matters, but it does not make every decision for</text><text x="22" y="80" font-size="16" fill="#383d38">people.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Limit</text><text x="22" y="59" font-size="16" fill="#383d38">A strategy needs evidence; it is not a universal rule for</text><text x="22" y="80" font-size="16" fill="#383d38">every community.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the community, action and supporting evidence.</text></g></svg>