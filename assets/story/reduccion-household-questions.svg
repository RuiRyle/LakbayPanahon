<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Move Can Affect Daily Work</title><desc id="desc">Different activities: A residence connects with work, water, relatives and institutions, not only a town center.. A fictional comparison: Nearer one place can mean farther from another in a teaching example, not every historical family.. Evidence of effects: Actual distances, routines and consequences require evidence in the named setting.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Move Can Affect Daily Work</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare plans, actual actions and effects on people.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">Different activities</text><text x="54" y="249" font-size="16" fill="#243b3b">A residence connects with</text><text x="54" y="273" font-size="16" fill="#243b3b">work, water, relatives and</text><text x="54" y="297" font-size="16" fill="#243b3b">institutions, not only a town</text><text x="54" y="321" font-size="16" fill="#243b3b">center.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">A fictional comparison</text><text x="369" y="249" font-size="16" fill="#243b3b">Nearer one place can mean</text><text x="369" y="273" font-size="16" fill="#243b3b">farther from another in a</text><text x="369" y="297" font-size="16" fill="#243b3b">teaching example, not every</text><text x="369" y="321" font-size="16" fill="#243b3b">historical family.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Evidence of effects</text><text x="684" y="249" font-size="16" fill="#243b3b">Actual distances, routines</text><text x="684" y="273" font-size="16" fill="#243b3b">and consequences require</text><text x="684" y="297" font-size="16" fill="#243b3b">evidence in the named</text><text x="684" y="321" font-size="16" fill="#243b3b">setting.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original household record or historical quotation.</text></g></svg>