<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Keep a find connected to its recorded setting</title><desc>A teaching record has a place, a soil layer and information about nearby finds. Moving an object without recording its setting can lose information. Leave possible finds in place and notify responsible site staff.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Keep a find connected to its recorded setting</text><rect x="45" y="110" width="430" height="420" rx="18" fill="#e4e8dc"/><rect x="525" y="110" width="430" height="420" rx="18" fill="#dbecef"/><text x="70" y="160" font-size="26">A useful find record</text><text x="70" y="230" font-size="23">Place: recorded</text><text x="70" y="280" font-size="23">Layer: recorded</text><text x="70" y="330" font-size="23">Nearby finds: recorded</text><text x="70" y="435" font-size="22">Context connects these clues</text><text x="550" y="160" font-size="26">Protect the record</text><text x="550" y="230" font-size="23">Leave the object in place</text><text x="550" y="280" font-size="23">Do not wash or move it</text><text x="550" y="330" font-size="23">Tell responsible site staff</text><text x="550" y="435" font-size="22">Learning is not ownership</text><text x="35" y="615" font-size="19">Teaching summaries and models, not photographs of original finds.</text></g></svg>