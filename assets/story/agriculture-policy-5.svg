<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Follow a Policy Through Time</title><desc id="d">Ending a system: Abolition concerns a particular rule or arrangement.. Before and after: Compare records from each period to explain what changed and continued.. Effects need evidence: A reform date alone does not prove equal gains for everyone.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Follow a Policy Through Time</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Ending a system</text><text x="22" y="59" font-size="16" fill="#383d38">Abolition concerns a particular rule or arrangement.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Before and after</text><text x="22" y="59" font-size="16" fill="#383d38">Compare records from each period to explain what changed and</text><text x="22" y="80" font-size="16" fill="#383d38">continued.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Effects need evidence</text><text x="22" y="59" font-size="16" fill="#383d38">A reform date alone does not prove equal gains for everyone.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check uses, rules, costs and choices.</text></g></svg>