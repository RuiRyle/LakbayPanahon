<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Choose for a purpose, using observations</title><desc>Fictional test for flexible prepared strands. A bends as needed. B breaks in the same test. Compare with the task; do not rank every material or product.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Choose for a purpose, using observations</text><rect x="35" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="50" y="210" font-size="25">TASK</text><text x="50" y="285" font-size="21">Flexible strands</text><text x="50" y="335" font-size="21">needed for this model</text><rect x="355" y="140" width="290" height="300" rx="18" fill="#dbecef"/><text x="370" y="210" font-size="25">MATERIAL A</text><text x="370" y="285" font-size="21">Bends as needed</text><text x="370" y="335" font-size="21">in the fictional test</text><rect x="675" y="140" width="290" height="300" rx="18" fill="#e4e8dc"/><text x="690" y="210" font-size="25">MATERIAL B</text><text x="690" y="285" font-size="21">Breaks when bent</text><text x="690" y="335" font-size="21">in the same test</text><text x="50" y="540" font-size="23">Teaching model: no restricted pattern or universal craft recipe.</text></g></svg>