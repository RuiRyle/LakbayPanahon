<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Similar words, different offices</title><desc id="desc">Governor-general: A leading central colonial office under the Spanish Crown.. Gobernadorcillo: A town-level colonial official, not the governor-general.. Historical limits: Do not assume identical duties or modern election rules for every year.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="29" fill="#ffe1a0">Similar words, different offices</text><text x="34" y="103" font-size="17" fill="#e0eee8">A teaching comparison, not one unchanged chart for every colonial year.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="194" font-size="18" font-weight="bold" fill="#76451f">Governor-general</text><text x="54" y="235" font-size="17" fill="#243b3b">A leading central colonial</text><text x="54" y="262" font-size="17" fill="#243b3b">office under the Spanish</text><text x="54" y="289" font-size="17" fill="#243b3b">Crown.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="194" font-size="18" font-weight="bold" fill="#76451f">Gobernadorcillo</text><text x="369" y="235" font-size="17" fill="#243b3b">A town-level colonial</text><text x="369" y="262" font-size="17" fill="#243b3b">official, not the</text><text x="369" y="289" font-size="17" fill="#243b3b">governor-general.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="194" font-size="18" font-weight="bold" fill="#76451f">Historical limits</text><text x="684" y="235" font-size="17" fill="#243b3b">Do not assume identical</text><text x="684" y="262" font-size="17" fill="#243b3b">duties or modern election</text><text x="684" y="289" font-size="17" fill="#243b3b">rules for every year.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern diagram, not an original order, election record or historical quotation.</text></g></svg>