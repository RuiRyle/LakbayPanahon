<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Compare Opportunities in Everyday Life</title><desc id="d">Practical access: An opportunity depends on the conditions that let someone take part.. Compare conditions: Time, materials and location can matter alongside an institutional rule.. Model limit: Fictional learner cards do not establish every historical households experience.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Compare Opportunities in Everyday Life</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Practical access</text><text x="22" y="59" font-size="16" fill="#383d38">An opportunity depends on the conditions that let someone take</text><text x="22" y="80" font-size="16" fill="#383d38">part.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Compare conditions</text><text x="22" y="59" font-size="16" fill="#383d38">Time, materials and location can matter alongside an</text><text x="22" y="80" font-size="16" fill="#383d38">institutional rule.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Model limit</text><text x="22" y="59" font-size="16" fill="#383d38">Fictional learner cards do not establish every historical</text><text x="22" y="80" font-size="16" fill="#383d38">households experience.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Examine power and records; respect equal human worth.</text></g></svg>