<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Tribute Was Required, Not a Gift</title><desc id="desc">A requirement: Tribute is a required payment under an authority, not automatically a voluntary present.. Forms and context: Money or goods could be involved. Check the particular rules, place and period.. Do not invent a universal rate: One amount in one record cannot supply every household's obligation across the colonial period.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">Tribute Was Required, Not a Gift</text><text x="34" y="103" font-size="17" fill="#e0eee8">Separate the arrangement, its practice and evidence about people.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">A requirement</text><text x="54" y="249" font-size="16" fill="#243b3b">Tribute is a required payment</text><text x="54" y="273" font-size="16" fill="#243b3b">under an authority, not</text><text x="54" y="297" font-size="16" fill="#243b3b">automatically a voluntary</text><text x="54" y="321" font-size="16" fill="#243b3b">present.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Forms and context</text><text x="369" y="249" font-size="16" fill="#243b3b">Money or goods could be</text><text x="369" y="273" font-size="16" fill="#243b3b">involved. Check the</text><text x="369" y="297" font-size="16" fill="#243b3b">particular rules, place and</text><text x="369" y="321" font-size="16" fill="#243b3b">period.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Do not invent a universal</text><text x="684" y="208" font-size="17" font-weight="bold" fill="#76451f">rate</text><text x="684" y="249" font-size="16" fill="#243b3b">One amount in one record</text><text x="684" y="273" font-size="16" fill="#243b3b">cannot supply every</text><text x="684" y="297" font-size="16" fill="#243b3b">household's obligation across</text><text x="684" y="321" font-size="16" fill="#243b3b">the colonial period.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not a land deed, authentic receipt or universal tax schedule.</text></g></svg>