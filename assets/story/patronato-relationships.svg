<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">What Was Royal Patronage?</title><desc id="desc">The term: Patronato Real refers here to royal patronage connecting Crown and Catholic institutions.. Different participants: Connected institutions did not make every official and religious worker the same person or role.. A limit: Institutional support does not establish everyone's belief or local consent.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">What Was Royal Patronage?</text><text x="34" y="103" font-size="17" fill="#e0eee8">Compare institutional relationships with evidence of actual practice.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">The term</text><text x="54" y="249" font-size="16" fill="#243b3b">Patronato Real refers here to</text><text x="54" y="273" font-size="16" fill="#243b3b">royal patronage connecting</text><text x="54" y="297" font-size="16" fill="#243b3b">Crown and Catholic</text><text x="54" y="321" font-size="16" fill="#243b3b">institutions.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Different participants</text><text x="369" y="249" font-size="16" fill="#243b3b">Connected institutions did</text><text x="369" y="273" font-size="16" fill="#243b3b">not make every official and</text><text x="369" y="297" font-size="16" fill="#243b3b">religious worker the same</text><text x="369" y="321" font-size="16" fill="#243b3b">person or role.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">A limit</text><text x="684" y="249" font-size="16" fill="#243b3b">Institutional support does</text><text x="684" y="273" font-size="16" fill="#243b3b">not establish everyone's</text><text x="684" y="297" font-size="16" fill="#243b3b">belief or local consent.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original allocation, appointment or ruling.</text></g></svg>