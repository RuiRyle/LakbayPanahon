<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Why fund a voyage?</title><desc id="desc">A desired benefit is not a guaranteed result. 1. Trade: Seek access to valued spices in networks already linking Asian communities.. 2. Support: A sponsor provides resources and pursues commercial or political goals.. 3. Uncertainty: Ships and supplies cost resources. A plan does not promise success or ownership.</desc><rect width="1000" height="450" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="36" y="60" font-size="28" fill="#ffe1a0">Why fund a voyage?</text><text x="36" y="98" font-size="17" fill="#e0eee8">A desired benefit is not a guaranteed result.</text><rect x="36" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="56" y="188" fill="#76451f" font-size="19" font-weight="bold">1. Trade</text><text x="56" y="225" fill="#243b3b" font-size="17">Seek access to valued spices in</text><text x="56" y="252" fill="#243b3b" font-size="17">networks already linking Asian</text><text x="56" y="279" fill="#243b3b" font-size="17">communities.</text><rect x="346" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="366" y="188" fill="#76451f" font-size="19" font-weight="bold">2. Support</text><text x="366" y="225" fill="#243b3b" font-size="17">A sponsor provides resources and</text><text x="366" y="252" fill="#243b3b" font-size="17">pursues commercial or political</text><text x="366" y="279" fill="#243b3b" font-size="17">goals.</text><rect x="656" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="676" y="188" fill="#76451f" font-size="19" font-weight="bold">3. Uncertainty</text><text x="676" y="225" fill="#243b3b" font-size="17">Ships and supplies cost</text><text x="676" y="252" fill="#243b3b" font-size="17">resources. A plan does not</text><text x="676" y="279" fill="#243b3b" font-size="17">promise success or ownership.</text><text x="36" y="425" font-size="15" fill="#e0eee8">Teaching diagram. Explain the evidence and its limits.</text></g></svg>