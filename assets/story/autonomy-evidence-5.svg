<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Compare Claims with Community Evidence</title><desc id="d">Perspective: A source has a maker, purpose and setting.. Compare evidence: Official claims, community accounts and archaeology can answer different questions.. Respect limits: No single source automatically speaks for every person or period.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Compare Claims with Community Evidence</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Perspective</text><text x="22" y="59" font-size="16" fill="#383d38">A source has a maker, purpose and setting.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Compare evidence</text><text x="22" y="59" font-size="16" fill="#383d38">Official claims, community accounts and archaeology can answer</text><text x="22" y="80" font-size="16" fill="#383d38">different questions.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Respect limits</text><text x="22" y="59" font-size="16" fill="#383d38">No single source automatically speaks for every person or</text><text x="22" y="80" font-size="16" fill="#383d38">period.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare claims, authority and community decisions.</text></g></svg>