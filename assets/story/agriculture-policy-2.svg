<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Rules Could Change Economic Choices</title><desc id="d">Rule: A policy can shape production and exchange.. Choice: A required buyer can limit where a grower sells.. Scope: Check the product, place and period covered by the rule.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Rules Could Change Economic Choices</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Rule</text><text x="22" y="59" font-size="16" fill="#383d38">A policy can shape production and exchange.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Choice</text><text x="22" y="59" font-size="16" fill="#383d38">A required buyer can limit where a grower sells.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Scope</text><text x="22" y="59" font-size="16" fill="#383d38">Check the product, place and period covered by the rule.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check uses, rules, costs and choices.</text></g></svg>