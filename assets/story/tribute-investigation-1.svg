<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">A Required Payment, Not a Gift</title><desc id="d">Required payment: Tribute was demanded under colonial authority, rather than simply offered as a gift.. Colonial resources: Collections supplied resources to the colonial system.. Agreement is separate: Recorded payment does not prove that a person approved of the demand.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><path d="M0 50H760M0 570H760" stroke="#bd9349" stroke-width="3"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">A Required Payment, Not a Gift</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Required payment</text><text x="22" y="59" font-size="16" fill="#383d38">Tribute was demanded under colonial authority, rather than</text><text x="22" y="80" font-size="16" fill="#383d38">simply offered as a gift.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Colonial resources</text><text x="22" y="59" font-size="16" fill="#383d38">Collections supplied resources to the colonial system.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Agreement is separate</text><text x="22" y="59" font-size="16" fill="#383d38">Recorded payment does not prove that a person approved of the</text><text x="22" y="80" font-size="16" fill="#383d38">demand.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check the demand, setting and source.</text></g></svg>