<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Connections Did Not Mean Equal Benefits</title><desc id="d">Connections: Objects and designs could move through exchange networks.. Different outcomes: Cargo value alone does not prove equal benefits for all people.. Continuity: Ending this route did not end all Philippine trade.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Connections Did Not Mean Equal Benefits</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Connections</text><text x="22" y="59" font-size="16" fill="#383d38">Objects and designs could move through exchange networks.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Different outcomes</text><text x="22" y="59" font-size="16" fill="#383d38">Cargo value alone does not prove equal benefits for all</text><text x="22" y="80" font-size="16" fill="#383d38">people.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Continuity</text><text x="22" y="59" font-size="16" fill="#383d38">Ending this route did not end all Philippine trade.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Follow goods, people and evidence.</text></g></svg>