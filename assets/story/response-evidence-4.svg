<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Choices Had Conditions and Limits</title><desc id="d">Conditions: Resources, relationships and pressures can affect choices.. Compare carefully: One response in one place is not a universal option for everyone.. Agency with limits: People could act without equal power or unlimited freedom.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Choices Had Conditions and Limits</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Conditions</text><text x="22" y="59" font-size="16" fill="#383d38">Resources, relationships and pressures can affect choices.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Compare carefully</text><text x="22" y="59" font-size="16" fill="#383d38">One response in one place is not a universal option for</text><text x="22" y="80" font-size="16" fill="#383d38">everyone.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Agency with limits</text><text x="22" y="59" font-size="16" fill="#383d38">People could act without equal power or unlimited freedom.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check the situation, action, conditions and outcome.</text></g></svg>