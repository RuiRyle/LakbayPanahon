<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Participants Could Have Different Concerns</title><desc id="d">Roles: Leaders, participants and affected residents need not be the same people.. Recorded action: Ask who is identified and what action the source actually describes.. No automatic motive: A name, religion or occupation does not reveal every concern or reason.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Participants Could Have Different Concerns</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Roles</text><text x="22" y="59" font-size="16" fill="#383d38">Leaders, participants and affected residents need not be the</text><text x="22" y="80" font-size="16" fill="#383d38">same people.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Recorded action</text><text x="22" y="59" font-size="16" fill="#383d38">Ask who is identified and what action the source actually</text><text x="22" y="80" font-size="16" fill="#383d38">describes.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. No automatic motive</text><text x="22" y="59" font-size="16" fill="#383d38">A name, religion or occupation does not reveal every concern</text><text x="22" y="80" font-size="16" fill="#383d38">or reason.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check concerns, actions, people and outcomes.</text></g></svg>