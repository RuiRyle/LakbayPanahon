<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Compare two construction details</title><desc>A shows two plank edges and a wooden dowel joining them. B shows an internal frame secured with bindings to a raised lug on a plank. Simplified teaching model, not a complete reconstruction or building instructions.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Compare two construction details</text><rect x="35" y="100" width="445" height="430" rx="18" fill="#e4e8dc"/><rect x="520" y="100" width="445" height="430" rx="18" fill="#dbecef"/><text x="60" y="155" font-size="25">A. Join neighbouring planks</text><path d="M80 240H250V350H80Z M270 240H440V350H270Z" fill="#b89b70" stroke="#735936" stroke-width="3"/><rect x="215" y="280" width="110" height="18" fill="#735936"/><text x="105" y="220" font-size="21">Plank</text><text x="325" y="220" font-size="21">Plank</text><path d="M270 305V380" stroke="#20364b" stroke-width="2"/><text x="190" y="415" font-size="23">Wooden dowel</text><text x="545" y="155" font-size="25">B. Attach an internal support</text><rect x="560" y="365" width="360" height="45" fill="#b89b70" stroke="#735936" stroke-width="3"/><path d="M650 365V320H720V365" fill="#b89b70" stroke="#735936" stroke-width="3"/><rect x="750" y="220" width="40" height="165" fill="#9b794d"/><path d="M675 330L768 290L780 305L690 350Z" fill="none" stroke="#38624e" stroke-width="7"/><text x="805" y="245" font-size="22">Frame</text><text x="575" y="295" font-size="22">Lug</text><text x="785" y="340" font-size="22">Binding</text><text x="600" y="445" font-size="22">Inside of a plank</text><text x="45" y="580" font-size="22">Selected details only. Recovered boats differ; this is not every boat design.</text></g></svg>