<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">A port works through people and connections</title><desc id="desc">A sea connection, landing area and existing community are linked in a teaching model. Ships, supplies, traders and relationships matter. The arrows do not establish exact historic routes.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">A port works through people and connections</text><text x="34" y="102" font-size="17" fill="#e0eee8">Conceptual model only: not an exact reconstruction of Cebu or Manila.</text>
