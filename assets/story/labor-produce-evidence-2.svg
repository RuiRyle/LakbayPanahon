<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Time Away Had Consequences</title><desc id="d">Time: Required work and travel could take time from other tasks.. Conditions: Distance, season and household support can change the burden.. Model limit: Six task slots illustrate a relationship, not a historical labor quota.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Time Away Had Consequences</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Time</text><text x="22" y="59" font-size="16" fill="#383d38">Required work and travel could take time from other tasks.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Conditions</text><text x="22" y="59" font-size="16" fill="#383d38">Distance, season and household support can change the burden.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Model limit</text><text x="22" y="59" font-size="16" fill="#383d38">Six task slots illustrate a relationship, not a historical</text><text x="22" y="80" font-size="16" fill="#383d38">labor quota.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Separate the demand, action and outcome.</text></g></svg>