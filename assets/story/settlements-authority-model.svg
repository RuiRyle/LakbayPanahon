<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">How far did a governing order reach?</title><desc id="desc">An institution can issue an order; its effects need separate evidence. A continuing body: A city council has governing duties. It is different from a ship's arrival.. An order is recorded: This shows that an order was issued, not that all people followed it.. Investigate the effect: Where was it carried out? With what resources? How did people respond?</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">How far did a governing order reach?</text><text x="34" y="102" font-size="17" fill="#e0eee8">An institution can issue an order; its effects need separate evidence.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="18" font-weight="bold">A continuing body</text><text x="54" y="234" font-size="17" fill="#243b3b">A city council has governing</text><text x="54" y="261" font-size="17" fill="#243b3b">duties. It is different from</text><text x="54" y="288" font-size="17" fill="#243b3b">a ship's arrival.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="18" font-weight="bold">An order is recorded</text><text x="369" y="234" font-size="17" fill="#243b3b">This shows that an order was</text><text x="369" y="261" font-size="17" fill="#243b3b">issued, not that all people</text><text x="369" y="288" font-size="17" fill="#243b3b">followed it.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="18" font-weight="bold">Investigate the effect</text><text x="684" y="234" font-size="17" fill="#243b3b">Where was it carried out?</text><text x="684" y="261" font-size="17" fill="#243b3b">With what resources? How did</text><text x="684" y="288" font-size="17" fill="#243b3b">people respond?</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model. Not a precise map, original image or historical quotation.</text></g></svg>