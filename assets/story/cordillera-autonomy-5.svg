<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Build Knowledge with Communities</title><desc id="d">Work together: Researchers and descendant communities can contribute to interpreting the past.. Different evidence: A site record, a collection entry and a community account support different questions.. Respect and limits: Living communities are not frozen objects, and no source speaks for every person.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Build Knowledge with Communities</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Work together</text><text x="22" y="59" font-size="16" fill="#383d38">Researchers and descendant communities can contribute to</text><text x="22" y="80" font-size="16" fill="#383d38">interpreting the past.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Different evidence</text><text x="22" y="59" font-size="16" fill="#383d38">A site record, a collection entry and a community account</text><text x="22" y="80" font-size="16" fill="#383d38">support different questions.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Respect and limits</text><text x="22" y="59" font-size="16" fill="#383d38">Living communities are not frozen objects, and no source</text><text x="22" y="80" font-size="16" fill="#383d38">speaks for every person.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the community, action and supporting evidence.</text></g></svg>