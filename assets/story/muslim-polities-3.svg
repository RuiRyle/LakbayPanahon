<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Trade Connected People and Work</title><desc id="d">Connections: Sulu had trading relationships with neighboring polities and wider markets.. Work and conditions: Exchange depended on work, which could include unequal and forced conditions.. No stereotype: Specific harmful actions do not define every person of a religion or community.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Trade Connected People and Work</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Connections</text><text x="22" y="59" font-size="16" fill="#383d38">Sulu had trading relationships with neighboring polities and</text><text x="22" y="80" font-size="16" fill="#383d38">wider markets.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Work and conditions</text><text x="22" y="59" font-size="16" fill="#383d38">Exchange depended on work, which could include unequal and</text><text x="22" y="80" font-size="16" fill="#383d38">forced conditions.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. No stereotype</text><text x="22" y="59" font-size="16" fill="#383d38">Specific harmful actions do not define every person of a</text><text x="22" y="80" font-size="16" fill="#383d38">religion or community.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the polity, people, period and supporting evidence.</text></g></svg>