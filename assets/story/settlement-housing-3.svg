<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="t d"><title id="t">Openings and Air Movement</title><desc id="d">A fictional sliding panel shown closed and open. An arrow illustrates ventilation rather than measured airflow or temperature.</desc><rect width="800" height="550" rx="24" fill="#eee2c7"/><g font-family="sans-serif" fill="#244c48"><text x="35" y="55" font-size="26">Openings and Air Movement</text><text x="35" y="87" font-size="16">Fictional teaching model / Not a measured historical plan</text><g fill="#fff8e8" stroke="#244c48" stroke-width="3"><rect x="75" y="180" width="270" height="225"/><rect x="455" y="180" width="270" height="225"/><rect x="75" y="180" width="135" height="225" fill="#d6c8a5"/><rect x="210" y="180" width="135" height="225" fill="#d6c8a5"/><rect x="590" y="180" width="135" height="225" fill="#d6c8a5"/></g><path d="M390 290H560M540 272L560 290L540 308" fill="none" stroke="#357b77" stroke-width="7"/><g font-size="23" text-anchor="middle"><text x="210" y="450">Closed model</text><text x="590" y="450">Open model</text></g><text x="385" y="155" font-size="18">Air can move through an opening</text><text x="35" y="510" font-size="17">Check dated evidence for a particular place and building.</text></g></svg>