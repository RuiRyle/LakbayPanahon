<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Follow the outward route</title><desc id="desc">Broad sequence, 1519-1521. Not a geographic map or exact ship track. 1. Begin westward: Spain > Atlantic Ocean > southern South America. 2. Cross the Pacific: Southern passage > Pacific Ocean > Philippine islands. 3. Distinct destination: Maluku (Spice Islands) is distinct from the Philippines. Many stops are omitted.</desc><rect width="1000" height="450" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="36" y="60" font-size="28" fill="#ffe1a0">Follow the outward route</text><text x="36" y="98" font-size="17" fill="#e0eee8">Broad sequence, 1519-1521. Not a geographic map or exact ship track.</text><rect x="36" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="56" y="188" fill="#76451f" font-size="19" font-weight="bold">1. Begin westward</text><text x="56" y="225" fill="#243b3b" font-size="17">Spain > Atlantic Ocean ></text><text x="56" y="252" fill="#243b3b" font-size="17">southern South America</text><rect x="346" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="366" y="188" fill="#76451f" font-size="19" font-weight="bold">2. Cross the Pacific</text><text x="366" y="225" fill="#243b3b" font-size="17">Southern passage > Pacific Ocean</text><text x="366" y="252" fill="#243b3b" font-size="17">> Philippine islands</text><rect x="656" y="150" width="286" height="240" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="676" y="188" fill="#76451f" font-size="19" font-weight="bold">3. Distinct destination</text><text x="676" y="225" fill="#243b3b" font-size="17">Maluku (Spice Islands) is</text><text x="676" y="252" fill="#243b3b" font-size="17">distinct from the Philippines.</text><text x="676" y="279" fill="#243b3b" font-size="17">Many stops are omitted.</text><text x="36" y="425" font-size="15" fill="#e0eee8">Teaching diagram. Explain the evidence and its limits.</text></g></svg>