<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Follow three different events</title><desc id="desc">Selected sequence; departure, settlement and return are not the same event. 1564: departure: Legazpi's expedition left Mexico, then part of New Spain, and crossed the Pacific.. 1565: Cebu base: A Spanish settlement was established in an existing community, amid local responses.. 1565: return connection: San Pedro returned to Mexico with Urdaneta, Salcedo and other participants.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Follow three different events</text><text x="34" y="102" font-size="17" fill="#e0eee8">Selected sequence; departure, settlement and return are not the same event.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">1564: departure</text><text x="54" y="234" font-size="17" fill="#243b3b">Legazpi's expedition left</text><text x="54" y="261" font-size="17" fill="#243b3b">Mexico, then part of New</text><text x="54" y="288" font-size="17" fill="#243b3b">Spain, and crossed the</text><text x="54" y="315" font-size="17" fill="#243b3b">Pacific.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">1565: Cebu base</text><text x="369" y="234" font-size="17" fill="#243b3b">A Spanish settlement was</text><text x="369" y="261" font-size="17" fill="#243b3b">established in an existing</text><text x="369" y="288" font-size="17" fill="#243b3b">community, amid local</text><text x="369" y="315" font-size="17" fill="#243b3b">responses.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">1565: return connection</text><text x="684" y="234" font-size="17" fill="#243b3b">San Pedro returned to Mexico</text><text x="684" y="261" font-size="17" fill="#243b3b">with Urdaneta, Salcedo and</text><text x="684" y="288" font-size="17" fill="#243b3b">other participants.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model, not an original image, precise map or historical quotation.</text></g></svg>