<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Different sources, different claims</title><desc id="desc">Name the action and its setting before drawing a conclusion. Cebu agreement: A marker records an agreement involving Tupas and Legazpi in 1565.. Manila Bay resistance: The Bangkusay marker records resistance in 1571 and a leader from Macabebe.. Limits of either claim: One action does not reveal everyone's motives or represent every community.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Different sources, different claims</text><text x="34" y="102" font-size="17" fill="#e0eee8">Name the action and its setting before drawing a conclusion.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="18" font-weight="bold">Cebu agreement</text><text x="54" y="234" font-size="17" fill="#243b3b">A marker records an agreement</text><text x="54" y="261" font-size="17" fill="#243b3b">involving Tupas and Legazpi</text><text x="54" y="288" font-size="17" fill="#243b3b">in 1565.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="18" font-weight="bold">Manila Bay resistance</text><text x="369" y="234" font-size="17" fill="#243b3b">The Bangkusay marker records</text><text x="369" y="261" font-size="17" fill="#243b3b">resistance in 1571 and a</text><text x="369" y="288" font-size="17" fill="#243b3b">leader from Macabebe.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="18" font-weight="bold">Limits of either claim</text><text x="684" y="234" font-size="17" fill="#243b3b">One action does not reveal</text><text x="684" y="261" font-size="17" fill="#243b3b">everyone's motives or</text><text x="684" y="288" font-size="17" fill="#243b3b">represent every community.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model. Not a precise map, original image or historical quotation.</text></g></svg>