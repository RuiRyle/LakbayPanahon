<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Autonomy Meant Local Decisions</title><desc id="d">Local affairs: Autonomy concerns maintaining decisions about community affairs.. Named case: Ifugao research links resistance with local strategies and organization.. Scope: Autonomy is not equal power for everyone or the absence of rules and contacts.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Autonomy Meant Local Decisions</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Local affairs</text><text x="22" y="59" font-size="16" fill="#383d38">Autonomy concerns maintaining decisions about community</text><text x="22" y="80" font-size="16" fill="#383d38">affairs.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Named case</text><text x="22" y="59" font-size="16" fill="#383d38">Ifugao research links resistance with local strategies and</text><text x="22" y="80" font-size="16" fill="#383d38">organization.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Scope</text><text x="22" y="59" font-size="16" fill="#383d38">Autonomy is not equal power for everyone or the absence of</text><text x="22" y="80" font-size="16" fill="#383d38">rules and contacts.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare claims, authority and community decisions.</text></g></svg>