<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Separate the aim from the role</title><desc id="desc">A sponsor's instruction is not proof of every resident's agreement. Spanish aims: Occupation and continued presence, together with a workable return connection.. Legazpi: Command of the expedition. Leadership did not mean performing every crew task.. Urdaneta and others: Navigation knowledge mattered alongside the work of captains, navigators and crew.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Separate the aim from the role</text><text x="34" y="102" font-size="17" fill="#e0eee8">A sponsor's instruction is not proof of every resident's agreement.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">Spanish aims</text><text x="54" y="234" font-size="17" fill="#243b3b">Occupation and continued</text><text x="54" y="261" font-size="17" fill="#243b3b">presence, together with a</text><text x="54" y="288" font-size="17" fill="#243b3b">workable return connection.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">Legazpi</text><text x="369" y="234" font-size="17" fill="#243b3b">Command of the expedition.</text><text x="369" y="261" font-size="17" fill="#243b3b">Leadership did not mean</text><text x="369" y="288" font-size="17" fill="#243b3b">performing every crew task.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">Urdaneta and others</text><text x="684" y="234" font-size="17" fill="#243b3b">Navigation knowledge mattered</text><text x="684" y="261" font-size="17" fill="#243b3b">alongside the work of</text><text x="684" y="288" font-size="17" fill="#243b3b">captains, navigators and</text><text x="684" y="315" font-size="17" fill="#243b3b">crew.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching model, not an original image, precise map or historical quotation.</text></g></svg>