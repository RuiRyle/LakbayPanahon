<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Keep comparable ceramic evidence in separate contexts</title><desc>Changsha manufacture in China is distinct from the Mt. Kamhantik find in Mulanay, Quezon and the Belitung shipwreck near Sumatra. Comparable ceramic types do not prove one ship linked the two finds.</desc><rect width="1000" height="650" fill="#f8f0de"/><g font-family="sans-serif" fill="#20364b"><text x="35" y="50" font-size="28">Keep comparable ceramic evidence in separate contexts</text><rect x="35" y="120" width="290" height="350" rx="18" fill="#e4e8dc"/><text x="50" y="180" font-size="22">PRODUCTION</text><text x="50" y="245" font-size="23">Changsha, China</text><text x="50" y="295" font-size="21">Stoneware tradition</text><text x="50" y="385" font-size="20">Where made</text><rect x="355" y="120" width="290" height="350" rx="18" fill="#dbecef"/><text x="370" y="180" font-size="22">FIND CONTEXT</text><text x="370" y="245" font-size="23">Mt. Kamhantik</text><text x="370" y="295" font-size="21">Mulanay, Quezon</text><text x="370" y="385" font-size="20">Recorded site</text><rect x="675" y="120" width="290" height="350" rx="18" fill="#e4e8dc"/><text x="690" y="180" font-size="22">OTHER CONTEXT</text><text x="690" y="245" font-size="23">Belitung wreck</text><text x="690" y="295" font-size="21">Near Sumatra</text><text x="690" y="385" font-size="20">Separate cargo evidence</text><text x="60" y="545" font-size="24">Compare materials, dates and settings before asserting a route.</text><text x="35" y="615" font-size="20">Teaching model or source summary; not a map of a documented voyage.</text></g></svg>