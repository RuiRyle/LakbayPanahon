<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Who could decide for Mactan?</title><desc id="desc">Compare positions; a demand is different from consent.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Who could decide for Mactan?</text><text x="34" y="101" font-size="17" fill="#e0eee8">Compare positions; a demand is different from consent.</text><rect x="34" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="190" fill="#76451f" font-size="20" font-weight="bold">The demand</text><text x="54" y="230" font-size="17" fill="#243b3b">Magellan sought recognition</text><text x="54" y="257" font-size="17" fill="#243b3b">of Spain and Humabon. Force</text><text x="54" y="284" font-size="17" fill="#243b3b">was used to press demands.</text><rect x="349" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="190" fill="#76451f" font-size="20" font-weight="bold">The refusal</text><text x="369" y="230" font-size="17" fill="#243b3b">Lapulapu refused this</text><text x="369" y="257" font-size="17" fill="#243b3b">recognition. The dispute</text><text x="369" y="284" font-size="17" fill="#243b3b">concerned authority.</text><rect x="664" y="145" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="190" fill="#76451f" font-size="20" font-weight="bold">Different choices</text><text x="684" y="230" font-size="17" fill="#243b3b">Zula sought Magellan's</text><text x="684" y="257" font-size="17" fill="#243b3b">support. One leader's choice</text><text x="684" y="284" font-size="17" fill="#243b3b">did not represent everyone.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. No exact scale, portraits or original dialogue.</text></g></svg>