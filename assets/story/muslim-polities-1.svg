<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Distinct Polities, Connected Communities</title><desc id="d">Political community: A polity concerns organized authority; a sultanate is headed by a sultan.. Distinct examples: Sulu and Maguindanao were separate polities with connections.. Variation: One religion or regional label does not describe every community or person.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Distinct Polities, Connected Communities</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Political community</text><text x="22" y="59" font-size="16" fill="#383d38">A polity concerns organized authority; a sultanate is headed</text><text x="22" y="80" font-size="16" fill="#383d38">by a sultan.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Distinct examples</text><text x="22" y="59" font-size="16" fill="#383d38">Sulu and Maguindanao were separate polities with connections.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Variation</text><text x="22" y="59" font-size="16" fill="#383d38">One religion or regional label does not describe every</text><text x="22" y="80" font-size="16" fill="#383d38">community or person.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the polity, people, period and supporting evidence.</text></g></svg>