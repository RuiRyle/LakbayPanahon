<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Heritage Can Continue and Change</title><desc id="d">Date the object: A modern object has its own making and use history.. Continuing knowledge: Skills may continue while uses and forms change.. Earlier claim: A later object alone does not establish every earlier detail.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Heritage Can Continue and Change</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Date the object</text><text x="22" y="59" font-size="16" fill="#383d38">A modern object has its own making and use history.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Continuing knowledge</text><text x="22" y="59" font-size="16" fill="#383d38">Skills may continue while uses and forms change.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Earlier claim</text><text x="22" y="59" font-size="16" fill="#383d38">A later object alone does not establish every earlier detail.</text></g><text x="42" y="595" font-size="14" fill="#66563b">What changed? What continued? What supports the claim?</text></g></svg>