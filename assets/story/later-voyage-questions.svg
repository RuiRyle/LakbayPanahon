<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Compare the evidence, not just names</title><desc id="desc">A sponsor's aim is not proof of an achieved outcome. What was wanted?: Trade access, routes and influence. Identify an aim before judging a result.. What was needed?: Supplies, ships and a workable return. Communities had their own interests.. What happened?: Check evidence of outcomes. Arrival alone does not show continuing colonial rule.</desc><rect width="1000" height="510" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">Compare the evidence, not just names</text><text x="34" y="102" font-size="17" fill="#e0eee8">A sponsor's aim is not proof of an achieved outcome.</text><rect x="34" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="193" fill="#76451f" font-size="19" font-weight="bold">What was wanted?</text><text x="54" y="234" font-size="17" fill="#243b3b">Trade access, routes and</text><text x="54" y="261" font-size="17" fill="#243b3b">influence. Identify an aim</text><text x="54" y="288" font-size="17" fill="#243b3b">before judging a result.</text><rect x="349" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="193" fill="#76451f" font-size="19" font-weight="bold">What was needed?</text><text x="369" y="234" font-size="17" fill="#243b3b">Supplies, ships and a</text><text x="369" y="261" font-size="17" fill="#243b3b">workable return. Communities</text><text x="369" y="288" font-size="17" fill="#243b3b">had their own interests.</text><rect x="664" y="150" width="292" height="290" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="193" fill="#76451f" font-size="19" font-weight="bold">What happened?</text><text x="684" y="234" font-size="17" fill="#243b3b">Check evidence of outcomes.</text><text x="684" y="261" font-size="17" fill="#243b3b">Arrival alone does not show</text><text x="684" y="288" font-size="17" fill="#243b3b">continuing colonial rule.</text><text x="34" y="480" font-size="15" fill="#e0eee8">Modern teaching diagram. Not a geographic map or original historical quotation.</text></g></svg>