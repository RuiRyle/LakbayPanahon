<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">A Missionary Aim Is Not Everyone's Belief</title><desc id="desc">The aim: Missionaries sought to spread their religion. An aim is not proof of everyone's belief.. Earlier traditions: Indigenous religious traditions and Islam existed before Catholic missionary activity in the islands.. Study respectfully: Learning religious history does not require students to practise or adopt the religion.</desc><rect width="1000" height="530" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="62" font-size="26" fill="#ffe1a0">A Missionary Aim Is Not Everyone's Belief</text><text x="34" y="103" font-size="17" fill="#e0eee8">Study historical evidence respectfully. No religious practice is required.</text><rect x="34" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="54" y="185" font-size="17" font-weight="bold" fill="#76451f">The aim</text><text x="54" y="249" font-size="16" fill="#243b3b">Missionaries sought to spread</text><text x="54" y="273" font-size="16" fill="#243b3b">their religion. An aim is not</text><text x="54" y="297" font-size="16" fill="#243b3b">proof of everyone's belief.</text><rect x="349" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="369" y="185" font-size="17" font-weight="bold" fill="#76451f">Earlier traditions</text><text x="369" y="249" font-size="16" fill="#243b3b">Indigenous religious</text><text x="369" y="273" font-size="16" fill="#243b3b">traditions and Islam existed</text><text x="369" y="297" font-size="16" fill="#243b3b">before Catholic missionary</text><text x="369" y="321" font-size="16" fill="#243b3b">activity in the islands.</text><rect x="664" y="150" width="292" height="320" rx="18" fill="#fff8e7" stroke="#cda65c"/><text x="684" y="185" font-size="17" font-weight="bold" fill="#76451f">Study respectfully</text><text x="684" y="249" font-size="16" fill="#243b3b">Learning religious history</text><text x="684" y="273" font-size="16" fill="#243b3b">does not require students to</text><text x="684" y="297" font-size="16" fill="#243b3b">practise or adopt the</text><text x="684" y="321" font-size="16" fill="#243b3b">religion.</text><text x="34" y="506" font-size="15" fill="#e0eee8">Modern teaching guide, not an original page, ceremony image or historical quotation.</text></g></svg>