<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Basi: Monopoly and Local Livelihoods</title><desc id="d">Named case: The Basi example concerns Ilocos in 1807 and opposition to a monopoly.. Separate dates: The event of 1807 and the painting series of 1821 are different stages.. Limits: A policy concern and later depiction do not reveal every participants motives.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Basi: Monopoly and Local Livelihoods</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Named case</text><text x="22" y="59" font-size="16" fill="#383d38">The Basi example concerns Ilocos in 1807 and opposition to a</text><text x="22" y="80" font-size="16" fill="#383d38">monopoly.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Separate dates</text><text x="22" y="59" font-size="16" fill="#383d38">The event of 1807 and the painting series of 1821 are</text><text x="22" y="80" font-size="16" fill="#383d38">different stages.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Limits</text><text x="22" y="59" font-size="16" fill="#383d38">A policy concern and later depiction do not reveal every</text><text x="22" y="80" font-size="16" fill="#383d38">participants motives.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare place, period, concern, action and source.</text></g></svg>