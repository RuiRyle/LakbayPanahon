<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">What does an exchange show?</title><desc id="desc">Connect a supported action with a limit on your conclusion. A need: The expedition members needed food, drink and rest.. Local participation: Local people provided supplies. The expedition offered goods in return.. A limit: An exchange does not by itself establish surrender of authority or permanent agreement.</desc><rect width="1000" height="490" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="34" y="60" font-size="29" fill="#ffe1a0">What does an exchange show?</text><text x="34" y="104" font-size="18" fill="#e0eee8">Connect a supported action with a limit on your conclusion.</text><rect x="34" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="62" cy="184" r="13" fill="#315c56"/><text x="62" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">1</text><text x="54" y="225" fill="#76451f" font-size="19" font-weight="bold">A need</text><text x="54" y="259" fill="#243b3b" font-size="17">The expedition members needed</text><text x="54" y="285" fill="#243b3b" font-size="17">food, drink and rest.</text><path d="M331 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="349" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="377" cy="184" r="13" fill="#315c56"/><text x="377" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">2</text><text x="369" y="225" fill="#76451f" font-size="19" font-weight="bold">Local participation</text><text x="369" y="259" fill="#243b3b" font-size="17">Local people provided</text><text x="369" y="285" fill="#243b3b" font-size="17">supplies. The expedition</text><text x="369" y="311" fill="#243b3b" font-size="17">offered goods in return.</text><path d="M646 292h12m-5-5 5 5-5 5" fill="none" stroke="#f4d493" stroke-width="2"/><rect x="664" y="155" width="292" height="270" rx="18" fill="#fff8e7" stroke="#cda65c"/><circle cx="692" cy="184" r="13" fill="#315c56"/><text x="692" y="190" text-anchor="middle" fill="#fff8e7" font-size="16">3</text><text x="684" y="225" fill="#76451f" font-size="19" font-weight="bold">A limit</text><text x="684" y="259" fill="#243b3b" font-size="17">An exchange does not by</text><text x="684" y="285" fill="#243b3b" font-size="17">itself establish surrender of</text><text x="684" y="311" fill="#243b3b" font-size="17">authority or permanent</text><text x="684" y="337" fill="#243b3b" font-size="17">agreement.</text><text x="34" y="461" font-size="16" fill="#e0eee8">Modern learning diagram. Not an original image or quotation from 1521.</text></g></svg>