<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Production Rules Could Raise Complaints</title><desc id="desc">Modern teaching cards: Rule: A quota required an amount of production.. Concern: The historical account describes complaints in affected areas.. Comparison: Government income and household wellbeing are different questions.</desc><rect width="760" height="610" rx="26" fill="#163e38"/><text x="42" y="54" fill="#ebcc83" font-family="sans-serif" font-size="16">HISTORY EVIDENCE JOURNAL</text><text x="42" y="103" fill="#fff5da" font-family="sans-serif" font-size="25">Production Rules Could Raise Complaints</text><rect x="42" y="145" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="175" fill="#61431e" font-family="sans-serif" font-size="20">Rule</text><text x="65" y="202" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">A quota required an amount of production.</tspan></text><rect x="42" y="275" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="305" fill="#61431e" font-family="sans-serif" font-size="20">Concern</text><text x="65" y="332" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">The historical account describes complaints in affected</tspan><tspan x="65" dy="22">areas.</tspan></text><rect x="42" y="405" width="676" height="112" rx="14" fill="#fff5da"/><text x="65" y="435" fill="#61431e" font-family="sans-serif" font-size="20">Comparison</text><text x="65" y="462" fill="#163e38" font-family="sans-serif" font-size="16"><tspan x="65" dy="0">Government income and household wellbeing are different</tspan><tspan x="65" dy="22">questions.</tspan></text><text x="42" y="581" fill="#fff5da" font-family="sans-serif" font-size="14">Modern learning diagram - not an original historical source</text></svg>