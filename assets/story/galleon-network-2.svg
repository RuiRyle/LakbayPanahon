<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Goods and Silver Moved Through a Network</title><desc id="d">Direction: Asian goods went toward the Americas while silver moved toward Manila.. Origin: A loading port is not necessarily the place an object was made.. Cargo limit: Examples do not establish every ships complete cargo or successful delivery.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Goods and Silver Moved Through a Network</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Direction</text><text x="22" y="59" font-size="16" fill="#383d38">Asian goods went toward the Americas while silver moved toward</text><text x="22" y="80" font-size="16" fill="#383d38">Manila.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Origin</text><text x="22" y="59" font-size="16" fill="#383d38">A loading port is not necessarily the place an object was</text><text x="22" y="80" font-size="16" fill="#383d38">made.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Cargo limit</text><text x="22" y="59" font-size="16" fill="#383d38">Examples do not establish every ships complete cargo or</text><text x="22" y="80" font-size="16" fill="#383d38">successful delivery.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Follow goods, people and evidence.</text></g></svg>