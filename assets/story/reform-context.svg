<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc"><title id="title">KEEP THE EVENTS IN CONTEXT</title><desc id="desc">1861: An objection: Parish-transfer concern. 1863: Pelaez dies: Manila earthquake. LATER: Reform continues: Study later events separately. Selected background - do not merge earlier advocacy with events of 1872.</desc><rect width="1060" height="590" rx="28" fill="#f6efd9"/><g font-family="system-ui,sans-serif"><text x="40" y="66" fill="#355742" font-size="28" font-weight="800">KEEP THE EVENTS IN CONTEXT</text><path d="M24 95H1036" stroke="#c8b47e" stroke-width="2"/><g><rect x="38" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="56" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="186" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">1861</text><text x="186" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">An objection</text><text x="186" y="366" text-anchor="middle" fill="#59674f" font-size="19">Parish-transfer concern</text></g><g><rect x="368" y="160" width="296" height="290" rx="22" fill="#e5efdf" stroke="#b6c6a6" stroke-width="2"/><rect x="386" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="516" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">1863</text><text x="516" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Pelaez dies</text><text x="516" y="366" text-anchor="middle" fill="#59674f" font-size="19">Manila earthquake</text></g><g><rect x="698" y="160" width="296" height="290" rx="22" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="716" y="180" width="260" height="64" rx="13" fill="#315c4b"/><text x="846" y="222" text-anchor="middle" fill="#fff6df" font-size="25" font-weight="800">LATER</text><text x="846" y="310" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Re