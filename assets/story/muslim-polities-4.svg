<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">An Agreement Needed Follow-up Evidence</title><desc id="d">Terms: An agreement records commitments or claims.. Versions: Check which text, translation and perspective a source presents.. Practice: Implementation and local effects need evidence beyond signing.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">An Agreement Needed Follow-up Evidence</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Terms</text><text x="22" y="59" font-size="16" fill="#383d38">An agreement records commitments or claims.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Versions</text><text x="22" y="59" font-size="16" fill="#383d38">Check which text, translation and perspective a source</text><text x="22" y="80" font-size="16" fill="#383d38">presents.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Practice</text><text x="22" y="59" font-size="16" fill="#383d38">Implementation and local effects need evidence beyond signing.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Name the polity, people, period and supporting evidence.</text></g></svg>