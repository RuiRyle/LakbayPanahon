<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Spread Was Not Everyone Joining</title><desc id="d">Reach: A source may describe a movement spreading beyond an initial place.. Joining: Participation needs evidence about people and actions.. Difference: Affected residents and participants are not automatically the same people.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Spread Was Not Everyone Joining</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Reach</text><text x="22" y="59" font-size="16" fill="#383d38">A source may describe a movement spreading beyond an initial</text><text x="22" y="80" font-size="16" fill="#383d38">place.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Joining</text><text x="22" y="59" font-size="16" fill="#383d38">Participation needs evidence about people and actions.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Difference</text><text x="22" y="59" font-size="16" fill="#383d38">Affected residents and participants are not automatically the</text><text x="22" y="80" font-size="16" fill="#383d38">same people.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Identify people, actions, conditions and evidence.</text></g></svg>