<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Tamblot: A Named Bohol Case</title><desc id="d">Role and place: CulturEd names Tamblot, a babaylan, in Bohol.. Period and concern: The entry dates the uprising to 1621 and connects it with earlier religious practices.. Limit: Limited biographical records do not justify invented conversations or universal motives.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Tamblot: A Named Bohol Case</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Role and place</text><text x="22" y="59" font-size="16" fill="#383d38">CulturEd names Tamblot, a babaylan, in Bohol.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Period and concern</text><text x="22" y="59" font-size="16" fill="#383d38">The entry dates the uprising to 1621 and connects it with</text><text x="22" y="80" font-size="16" fill="#383d38">earlier religious practices.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Limit</text><text x="22" y="59" font-size="16" fill="#383d38">Limited biographical records do not justify invented</text><text x="22" y="80" font-size="16" fill="#383d38">conversations or universal motives.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare place, period, concern, action and source.</text></g></svg>