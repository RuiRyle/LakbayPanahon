<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="title desc"><title id="title">THE ILOILO EXCHANGE CASE</title><desc id="desc">1855: Port opens: International trade. 1859: Sugar outward: Iloilo to Melbourne. 1863: Machinery inward: Glasgow to Iloilo. Export = outward. Import = inward. Identify the direction.</desc><rect width="1060" height="600" rx="28" fill="#f6efd9"/><path d="M24 95H1036" stroke="#c8b47e" stroke-width="2"/><text x="40" y="62" font-family="system-ui,sans-serif" fill="#355742" font-size="28" font-weight="800">THE ILOILO EXCHANGE CASE</text><g font-family="system-ui,sans-serif"><g><rect x="38" y="170" width="296" height="280" rx="24" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="58" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="186" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">1855</text><text x="186" y="320" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Port opens</text><text x="186" y="370" text-anchor="middle" fill="#59674f" font-size="20">International trade</text></g><g><rect x="368" y="170" width="296" height="280" rx="24" fill="#e5efdf" stroke="#b6c6a6" stroke-width="2"/><rect x="388" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="516" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">1859</text><text x="516" y="320" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Sugar outward</text><text x="516" y="370" text-anchor="middle" fill="#59674f" font-size="20">Iloilo to Melbourne</text></g><g><rect x="698" y="170" width="296" height="280" rx="24" fill="#fffdf4" stroke="#b6c6a6" stroke-width="2"/><rect x="718" y="194" width="256" height="64" rx="14" fill="#315c4b"/><text x="846" y="236" text-anchor="middle" fill="#fff6df" font-size="30" font-weight="800">1863</text><text x="846" y="320" text-anchor="middle" fill="#304e3c" font-size="25" font-weight="700">Machinery inward</text><text x="846" y="370" text-anchor="middle" fill="#59674f" font-size="20">Glasgow to Iloilo</text></g><path d="M338 312h25m-9-9 9 9-9 9M668 312h25m-9-9 9 9-9 9" fill="none" stroke="#98783a" stroke-width="4"/><text x="40" y="518" fill="#526149" font-size="23">Export = outward. Import = inward. Identify the direction.</text><text x="40" y="558" fill="#786644" font-size="18">Modern teaching diagram - examine the clues, then explain your choice.</text></g></svg>
