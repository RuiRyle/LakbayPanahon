<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Study Religious Life Respectfully</title><desc id="d">Activity: A class or ceremony record can describe a public action.. Private belief: Participation alone does not reveal every persons inner understanding.. Respectful inquiry: History activities assess evidence rather than a students own religion.</desc><rect width="760" height="610" rx="24" fill="#e2ece8"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Study Religious Life Respectfully</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Activity</text><text x="22" y="59" font-size="16" fill="#383d38">A class or ceremony record can describe a public action.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Private belief</text><text x="22" y="59" font-size="16" fill="#383d38">Participation alone does not reveal every persons inner</text><text x="22" y="80" font-size="16" fill="#383d38">understanding.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Respectful inquiry</text><text x="22" y="59" font-size="16" fill="#383d38">History activities assess evidence rather than a students own</text><text x="22" y="80" font-size="16" fill="#383d38">religion.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Check materials, access, learning and responses.</text></g></svg>