<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d"><title id="t">Follow Resources Through a Household</title><desc id="d">Identify the demand: Tribute, labor service and produce delivery should not be confused.. Compare resources: The same demand can leave households with different resources.. Model boundary: Twelve minus three is nine; seven minus three is four, in a fictional model only.</desc><rect width="760" height="610" rx="24" fill="#eee2c7"/><g font-family="sans-serif"><text x="42" y="89" font-size="25" fill="#244c48">Follow Resources Through a Household</text><text x="42" y="119" font-size="16" fill="#66563b">EVIDENCE QUEST / MODERN TEACHING GUIDE</text><g transform="translate(42 150)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">1. Identify the demand</text><text x="22" y="59" font-size="16" fill="#383d38">Tribute, labor service and produce delivery should not be</text><text x="22" y="80" font-size="16" fill="#383d38">confused.</text></g><g transform="translate(42 280)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">2. Compare resources</text><text x="22" y="59" font-size="16" fill="#383d38">The same demand can leave households with different resources.</text></g><g transform="translate(42 410)"><rect width="676" height="110" rx="18" fill="#fff8e8" stroke="#bd9349"/><text x="22" y="32" font-size="21" fill="#244c48">3. Model boundary</text><text x="22" y="59" font-size="16" fill="#383d38">Twelve minus three is nine; seven minus three is four, in a</text><text x="22" y="80" font-size="16" fill="#383d38">fictional model only.</text></g><text x="42" y="595" font-size="14" fill="#66563b">Compare resources, time, choices and responses.</text></g></svg>