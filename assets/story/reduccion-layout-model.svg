<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">A proposed settlement: teaching model</title><desc id="desc">An open center connects residences and institutions by paths. Work and water connections also matter. This is a fictional model without scale, exact counts or travel times; it is not proof that a proposed settlement was built.</desc><rect width="1000" height="550" rx="22" fill="#163e42"/><g font-family="Arial,sans-serif"><text x="32" y="55" font-size="28" fill="#ffe1a0">A proposed settlement: teaching model</text><text x="32" y="96" font-size="17" fill="#e0eee8">Not a real town plan. No scale, household count or actual travel times.</text><rect x="32" y="130" width="936" height="340" rx="18" fill="#e0ead7"/><path d="M170 300H810 M490 160V445 M170 300L100 440 M810 300L900 435" stroke="#b1986b" stroke-width="13" fill="none"/><rect x="383" y="245" width="215" height="125" fill="#efdcad" stroke="#7c6745" stroke-width="3"/><text x="414" y="300" font-size="23" fill="#243b3b">Open center</text><text x="417" y="330" font-size="16" fill="#243b3b">Proposed space</text><g fill="#fff7e6" stroke="#78613e" stroke-width="3"><path d="M105 210h110v65H105Z M95 210l65-42 65 42Z"/><path d="M750 210h110v65H750Z M740 210l65-42 65 42Z"/><rect x="377" y="157" width="225" height="55" rx="7"/><rect x="707" y="353" width="185" height="55" rx="7"/></g><g font-size="18" fill="#243b3b"><text x="111" y="251">Residence</text><text x="756" y="251">Residence</text><text x="398" y="191">Institution model</text><text x="729" y="387">Institution model</text><text x="63" y="455">Work / water connections?</text><text x="680" y="455">Actual use needs evidence</text></g><text x="32" y="515" font-size="17" fill="#e0eee8">A proposed arrangement is different from evidence of buildings, residence and local responses.</text></g></svg>