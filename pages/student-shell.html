<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081629">
    <title>LakbayPanahon | Student Journey</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #081629; }
        #studentRouteFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #081629; }
        #shellLoading { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; gap: 18px; justify-items: center; background: #081629; color: #e7edf4; font: 600 14px/1.5 "Segoe UI", Arial, sans-serif; }
        #shellLoading[hidden] { display: none; }
        #shellRecovery { max-width: 340px; padding: 0 20px; text-align: center; }
        #shellRecovery[hidden] { display: none; }
        .shell-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .shell-actions button, .shell-actions a { border: 1px solid #d8b968; border-radius: 10px; background: #ecd9a6; color: #081629; padding: 12px 16px; font: inherit; text-decoration: none; }
        .shell-actions :focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
<link rel="stylesheet" href="../css/app-dialog.css">
<link rel="stylesheet" href="../css/interface-icons.css">
<link rel="stylesheet" href="../css/interface-clarity.css">
<link rel="stylesheet" href="../css/page-transition.css">
</head>
<body>
    <div id="shellLoading">
        <div id="shellLoadingCompass" aria-hidden="true"><span class="lp-compass-mark"></span></div>
        <span id="shellLoadingMessage" role="status">Opening your learning journey…</span>
        <div id="shellRecovery" hidden>
            <p>Check your connection, then try again. Saved learning progress stays in your account.</p>
            <div class="shell-actions">
                <button id="shellRetry" type="button">Try Again</button>
                <a href="student-shell.html?route=my-journey.html">Back to Journey</a>
            </div>
        </div>
    </div>
    <iframe id="studentRouteFrame" title="LakbayPanahon student workspace" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe>
    <script type="module" src="../js/page-transition.js"></script>
    <script type="module" src="../js/student-shell.js"></script>
</body>
</html>
