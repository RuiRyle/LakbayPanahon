<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LakbayPanahon Firebase Connection Check</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/brand/favicon.svg">
    <link rel="stylesheet" href="../css/page-transition.css">
</head>
<body>
    <h2>Firebase Connection Check</h2>
    <p>Uses the original LakbayPanahon Firebase project and your signed-in account.</p>
    <p><a href="login.html">Sign in</a> before running the check.</p>
    <button id="runTest" disabled>Check student connection</button>
    <pre id="output">Checking sign-in...</pre>
    <script type="module">
        import { auth, db } from "../js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { doc, getDocFromServer } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
        const button = document.getElementById("runTest");
        const output = document.getElementById("output");
        onAuthStateChanged(auth, user => {
            button.disabled = !user;
            output.textContent = user ? "Signed in. Ready to check Firestore." : "Sign in with your student account first.";
        });
        button.addEventListener("click", async () => {
            const user = auth.currentUser;
            if (!user) return;
            button.disabled = true;
            output.textContent = "Checking Firestore...";
            try {
                const profile = await getDocFromServer(doc(db, "users", user.uid));
                if (auth.currentUser?.uid !== user.uid) return;
                const student = profile.data();
                output.textContent = !profile.exists() ? "Connected, but your student profile is missing."
                    : student.role === "student" && student.status === "active"
                        ? "Connected to lakbaypanahon-1797e. Your student account is active."
                        : "Connected. This account is not an active student.";
            } catch (error) {
                output.textContent = (error.code || "Connection failed") + ": " + error.message;
            } finally {
                button.disabled = !auth.currentUser;
            }
        });
    </script>

    <script type="module" src="../js/page-transition.js"></script>
</body>
</html>
