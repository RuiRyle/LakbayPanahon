
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>LakbayPanahon Local AI Auth Test</title>
</head>

<body>
    <h2>LakbayPanahon — Local AI Auth Test</h2>

    <p>
        This page uses Firebase emulators only.
        It does not connect to production Authentication,
        Firestore, or Cloud Functions.
    </p>

    <button id="runTest">
        Test Authenticated AI Request
    </button>

    <pre id="output">Ready.</pre>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

        import {
            getAuth,
            connectAuthEmulator,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

        import {
            getFunctions,
            connectFunctionsEmulator,
            httpsCallable
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js";

        const output = document.getElementById("output");
        const button = document.getElementById("runTest");

        if (
            !["localhost", "127.0.0.1"].includes(
                window.location.hostname
            )
        ) {
            button.disabled = true;
            output.textContent =
                "This test is allowed only on localhost.";
            throw new Error("Local test only");
        }

        const app = initializeApp({
            apiKey: "local-test-key",
            authDomain: "lakbaypanahon-1797e.firebaseapp.com",
            projectId: "lakbaypanahon-1797e",
            appId: "local-ai-auth-test"
        }, "local-ai-auth-test");

        const auth = getAuth(app);

        connectAuthEmulator(
            auth,
            "http://127.0.0.1:9099"
        );

        const functions = getFunctions(
            app,
            "asia-southeast1"
        );

        connectFunctionsEmulator(
            functions,
            "127.0.0.1",
            5001
        );

        button.addEventListener("click", async () => {
            button.disabled = true;
            output.textContent = "Testing...";

            try {
                const credential =
                    await signInAnonymously(auth);

                    console.log("LOCAL TEST USER UID:", credential.user.uid);
output.textContent =
    "LOCAL TEST USER UID:\n" +
    credential.user.uid +
    "\n\nCalling AI function...";

                

                const callable = httpsCallable(
                    functions,
                    "getLearningAssistance"
                );

                const result = await callable({
                    type: "practice_hint",
                    chapterId: "ai-test-chapter",
                    missionId: "ai-test-mission",
                    contentId: "ai-test-question"
                });

                output.textContent =
                    "Function response:\n" +
                    JSON.stringify(result.data, null, 2);

            } catch (error) {
                output.textContent =
                    "Result:\n" +
                    error.code + "\n" +
                    error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
